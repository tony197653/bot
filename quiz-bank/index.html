<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5F4F1">
  <title>考題網</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/b.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/quiz.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
</head>
<body class="app-body">
  <div class="app-shell">
    <header class="app-top">
      <div class="app-top-in">
        <div class="hdr-title m8bar">
          <button type="button" class="mbtn m6" data-drawer-toggle aria-label="開啟選單" aria-expanded="false" aria-controls="app-drawer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line class="l1" x1="5" y1="7" x2="19" y2="7"/><line class="l2" x1="5" y1="12" x2="19" y2="12"/><line class="l3" x1="5" y1="17" x2="19" y2="17"/></svg>
          </button>
          <a class="blink" href="#/" data-route="home" aria-label="考題網 首頁"><span class="bmark" aria-hidden="true">考</span><span class="bname" aria-hidden="true">考題網</span></a>
          <nav class="app-nav" aria-label="主要">
            <a href="#/" data-route="home">首頁</a>
            <a href="#/wrong" data-route="wrong">錯題本</a>
            <a href="#/fav" data-route="fav">收藏夾</a>
            <a href="#/import" data-route="import" data-admin-only hidden>匯入</a>
          </nav>
        </div>
        <div class="nav-user m1">
          <button type="button" class="nav-avatar" id="nav-avatar" title="帳號選單" aria-label="帳號選單" aria-haspopup="menu" aria-expanded="false" aria-controls="nav-user-menu">
            <span class="nav-avatar-letter" aria-hidden="true">?</span>
            <span class="nav-avatar-label"><span class="nav-avatar-name">帳號</span><span class="nav-avatar-chev" aria-hidden="true">↓</span></span>
          </button>
          <div class="nav-user-menu" id="nav-user-menu" role="menu" aria-label="帳號" hidden>
            <button type="button" class="mi" role="menuitem" id="btn-signout-menu">登出</button>
          </div>
        </div>
      </div>
    </header>
    <main class="app-main" id="app-main" tabindex="-1"></main>
  </div>
  <div class="drawer-backdrop" aria-hidden="true"></div>
  <aside class="app-drawer" id="app-drawer" aria-hidden="true" aria-label="導覽">
    <a href="#/" data-route="home">首頁</a>
    <a href="#/wrong" data-route="wrong">錯題本</a>
    <a href="#/fav" data-route="fav">收藏夾</a>
    <a href="#/import" data-route="import" data-admin-only hidden>匯入校對</a>
    <button type="button" class="btn b2" id="btn-signout">登出</button>
  </aside>
  <div id="app-toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
