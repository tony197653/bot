*{box-sizing:border-box}

 transition:background-color .22s var(--ease),color .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease),transform .14s var(--ease),opacity .22s var(--ease)}
.btn:focus-visible,.opt:focus-visible,.bub:focus-visible,.acc-b:focus-visible,.g1 button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn:active:not(:disabled){transform:scale(.97)}

.acc-i.open .chev{transform:rotate(180deg)}

.acc-p>div{overflow:hidden;min-height:0}

.acc-i.open .acc-tx{opacity:1;transform:none;transition:opacity .35s var(--ease-out) .06s,transform .4s var(--ease-out) .06s}

.t1 td.num{white-space:nowrap;width:1%}.t1 td:last-child{width:1%}
.t1 td:last-child{white-space:nowrap}.t1 .l3{display:block;width:max-content;margin-top:4px}
.t1 tr:last-child td{border-bottom:0}
.t1 .r{text-align:right}.t1 .num{font-variant-numeric:tabular-nums}
.ucode{display:block;font-family:var(--font-num);font-size:12px;line-height:1.4;color:var(--mute);letter-spacing:.04em}
.uname{display:block;line-height:1.5}

.rv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}

.g1 button[aria-selected=true]{color:var(--ink);font-weight:600}

.g1.two .g1-thumb{transform:translateX(100%)}
.rv-list{list-style:none;margin:0;padding:0}
.rv{padding:14px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.only-wrong .rv.ok{display:none}
.rv-q{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute)}
.rv-st{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:13px;padding:1px 8px 1px 4px;border-radius:999px}
.rv-st svg{width:14px;height:14px}
.rv.ok .rv-st{color:var(--ok-ink);background:var(--ok-soft)}.rv.bad .rv-st{color:var(--bad-ink);background:var(--bad-soft)}
.rv-stem{font-size:15px;margin-top:4px;line-height:1.75}

.r-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
@media (max-width:767px){
 .r-actions{position:sticky;bottom:0;z-index:5;margin:20px calc(-1*max(16px,env(safe-area-inset-left))) 0;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:var(--bar-bg);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);box-shadow:0 -1px 0 var(--line);display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
 .r-actions #retry{grid-column:1/-1}
 .r-actions .b2,.r-actions .b5{min-height:44px}
 .r-actions .b5{justify-self:center;padding:0 10px}

/* N1 提示 */

.toast.on{opacity:1;transform:translate(-50%,0);transition:opacity .3s var(--ease-out),transform .4s var(--spring)}
/* 共用：換題的基本骨架（各方向覆寫手感） */
.qcard{transition:opacity var(--in-ms,.5s) var(--ease-out),transform var(--in-ms,.5s) var(--ease-out),filter var(--in-ms,.5s) var(--ease-out)}

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0s!important;scroll-behavior:auto!important}}

/* 鍵盤：提示（只在有滑鼠的裝置出現） */
.kb-hint{display:none;margin:10px 2px 0;font-size:12.5px;line-height:1.5;color:var(--mute);letter-spacing:.04em;opacity:.85}
.kb-hint kbd{font:inherit;font-size:11.5px;padding:0 5px;margin:0 1px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line-strong)}

.opt:focus-visible{outline-offset:2px}

/* ===== C 夜讀專注（深色＋彈性） ===== */
:root{color-scheme:dark;--bg:#0D0F13;--surface:#161920;--surface-2:#1D2129;--ink:#ECEEF3;--ink-rgb:0,0,0;--mute:#A0A7B4;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.2);
 --accent:#8FA2FF;--sel:rgba(143,162,255,.3);
 --ok:#42C9A0;--ok-ink:#5EDDB8;--ok-soft:rgba(66,201,160,.13);--bad:#FF7A7A;--bad-ink:#FF9A9A;--bad-soft:rgba(255,122,122,.13);--warn:#F0B44A;
 --b1-bg:#ECEEF3;--b1-fg:#0D0F13;--b1-hover:#FFFFFF;--top-bg:rgba(13,15,19,.82);--bar-bg:rgba(13,15,19,.9);
 --g1-bg:#1D2129;--g1-thumb:#2B303B;--toast-bg:#ECEEF3;--toast-fg:#0D0F13;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--shadow-up:0 2px 4px rgba(0,0,0,.3),0 14px 32px rgba(0,0,0,.4);
 --pop-shadow:0 2px 4px rgba(0,0,0,.3),0 16px 40px -8px rgba(0,0,0,.6);--sheet-shadow:0 1px 2px rgba(0,0,0,.3),0 24px 64px -12px rgba(0,0,0,.7);
 --font:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--font-stem:var(--font);--font-num:"Inter",system-ui,sans-serif;
 --in-ms:.55s;--out-ms:.16s}
.bar{box-shadow:0 -1px 0 var(--line)}
.b2{background:var(--surface);border-color:var(--line-strong)}
@media (hover:hover) and (pointer:fine){.b2:hover:not(:disabled){background:var(--surface-2)}}
.b1:disabled{opacity:1;background:#2A2F39;color:#8E95A3}
.prog{height:3px;background:rgba(255,255,255,.06)}
.prog i{background:linear-gradient(90deg,#7C8FFF,#A9B6FF);transition:transform .7s var(--spring)}
/* 泡泡：圓角方塊＋彈跳 */
.bub-d{border-radius:var(--r-sm);background:var(--surface-2);color:var(--mute);font-size:13px;transition:background-color .22s var(--ease),color .22s var(--ease),box-shadow .22s var(--ease),transform .45s var(--spring)}
.bub.now .bub-d{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}
.bub.ok .bub-d{background:var(--ok-soft);color:var(--ok-ink)}
.bub.bad .bub-d{background:var(--bad-soft);color:var(--bad-ink)}
.bub.now.ok .bub-d,.bub.now.bad .bub-d{box-shadow:inset 0 0 0 1.5px currentColor}
.bub-m{color:var(--bg);box-shadow:0 0 0 2px var(--bg)}
.bub.ok .bub-m{background:var(--ok)}.bub.bad .bub-m{background:var(--bad)}
.bub.ok .bub-m,.bub.bad .bub-m{animation:pop .5s var(--spring) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
/* 題目卡 */
.qcard{background:var(--surface);border-radius:var(--r-lg);padding:20px 16px 16px;box-shadow:0 0 0 1px var(--line),var(--shadow);transition:opacity .4s var(--ease-out),transform .55s var(--spring)}
.qcard.leaving{opacity:0;transform:translateX(calc(var(--dir,1)*-28px)) scale(.97)}
.qcard.entering{opacity:0;transform:translateX(calc(var(--dir,1)*44px)) scale(.98)}
.qno b{color:var(--ink);font-weight:700}
.tag{background:rgba(143,162,255,.14);color:#B7C3FF}
.stem{font-weight:500;font-size:18px}
.fig{background:#F4F5F8;border-radius:var(--r);padding:10px 8px;color:#16181D}
.fig svg{color:#16181D}.fig .fig-hi{stroke:#4A5BD6}.fig .fig-dot{fill:#4A5BD6}.fig .fig-mute{fill:#4D5361}
.opts{gap:10px}
/* 選項像實體按鍵 */
.opt{background:var(--surface-2);color:var(--ink);border-radius:var(--r);font-weight:500;padding-bottom:13px;
 box-shadow:inset 0 0 0 1px var(--line),inset 0 -3px 0 rgba(0,0,0,.35);
 transition:transform .35s var(--spring),background-color .22s var(--ease),box-shadow .22s var(--ease),color .22s var(--ease)}
.opt::after{content:"";position:absolute;inset:-1px;border-radius:calc(var(--r) + 1px);box-shadow:0 0 0 2px var(--ring,transparent);opacity:0;transform:scale(.98);transition:opacity .2s var(--ease),transform .35s var(--spring);pointer-events:none}
@media (hover:hover) and (pointer:fine){.opt:not([aria-disabled]):hover{background:#252A34}}
.opt:active:not([aria-disabled]){transform:scale(.97) translateY(1px);transition-duration:.12s;transition-timing-function:var(--ease)}
.key{border-radius:var(--r-sm);background:rgba(255,255,255,.06);color:var(--mute);font-weight:700}
.opt.chosen .key{background:var(--accent);color:#0D0F13}
.opt.ok{background:var(--ok-soft);--ring:var(--ok)}
.opt.ok .key{background:var(--ok);color:#0D0F13}
.opt.bad{background:var(--bad-soft);--ring:var(--bad)}
.opt.bad .key{background:var(--bad);color:#0D0F13}
.opt.ok::after,.opt.bad::after{opacity:1;transform:none}
.opt.dim{color:var(--mute);background:var(--surface)}
.opt.ok .mk{color:var(--ok)}.opt.bad .mk{color:var(--bad)}
.revealed.fresh .opt.ok .mk svg,.revealed.fresh .opt.bad .mk svg{animation:icoC .45s var(--spring) both}
@keyframes icoC{from{transform:scale(.25);opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
.revealed.fresh .opt.chosen.ok{animation:boing .55s var(--spring) both}
@keyframes boing{0%{transform:scale(.97)}40%{transform:scale(1.02)}100%{transform:none}}
.revealed.fresh .opt.bad{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.qcard.in .opt{animation:optC .55s var(--spring) both;animation-delay:calc(var(--i)*50ms + 90ms)}
@keyframes optC{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.fb{margin-top:14px;padding:12px 14px 6px;border-radius:var(--r);background:var(--surface-2)}
.revealed.fresh .fb{animation:fbC .5s var(--spring) .12s both}
@keyframes fbC{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.is-ok .vi{background:var(--ok);color:#0D0F13}.is-bad .vi{background:var(--bad);color:#0D0F13}
.is-ok .vt{color:var(--ok-ink)}.is-bad .vt{color:var(--bad-ink)}
.revealed.fresh .vi{animation:icoC .45s var(--spring) .2s both}
.a1 .acc-i{border-color:var(--line)}.a1 .acc-i:last-child{border-bottom:0}
/* 結算：數字跳上來＋方塊彈出 */
.r-hero{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line);padding:22px 16px 20px}
.score .num{font-weight:700;letter-spacing:-.03em}
.segs i{width:34px;height:10px;border-radius:999px}
.segs i.ok{background:var(--ok)}.segs i.bad{background:var(--bad)}
.result.in .segs i{animation:pop .5s var(--spring) both;animation-delay:calc(var(--i)*70ms + 300ms)}
.stat{background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:var(--r)}
.panel{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.result.in .r-hero{animation:optC .6s var(--spring) both}
.result.in .stat{animation:optC .55s var(--spring) both}
.result.in .stat:nth-child(2){animation-delay:.06s}.result.in .stat:nth-child(3){animation-delay:.12s}
.result.in .r-grid{animation:optC .6s var(--spring) .2s both}
.l3{border-color:var(--line-strong)}
.katex{color:inherit}

/* 鍵盤高亮：只變底色，不縮放 */
.opt:not([aria-disabled]):focus-visible{background:#252A34}

</style></head>

</div></footer>

<script>
window.QCFG={"outMs": 160, "countUp": true};
const QUIZ={title:"示範回・數學＋理化",tag:"示範",questions:[
{id:"demo-q1",subject:"math",unitCode:"M8-3",unit:"一元二次方程式",level:"中",
 stem:"若 \\(a\\)、\\(b\\) 為方程式 \\(x^2-5x+6=0\\) 的兩根，則 \\(a^2+b^2\\) 的值為何？",
 options:["\\(11\\)","\\(13\\)","\\(25\\)","\\(37\\)"],answer:1,
 explain:"先因式分解：\\[x^2-5x+6=(x-2)(x-3)=0\\]兩根是 2 和 3，所以 \\(a^2+b^2=4+9=13\\)。選 (C) 25 是把 \\((a+b)^2\\) 當成答案，少減了 \\(2ab\\)。"},
{id:"demo-q2",subject:"math",unitCode:"M9-3",unit:"三角形的外心",level:"中",fig:"tri",
 stem:"如圖，直角三角形 \\(ABC\\) 中，\\(\\angle C=90^\\circ\\)，\\(\\overline{AC}=6\\)，\\(\\overline{BC}=8\\)，\\(D\\) 為 \\(\\overline{AB}\\) 的中點。\\(\\overline{CD}\\) 的長度為何？",
 options:["4","5","6","7"],answer:1,
 explain:"由畢氏定理 \\(\\overline{AB}=\\sqrt{6^2+8^2}=10\\)。直角三角形斜邊的中點就是外心，到三個頂點一樣遠，所以 \\(\\overline{CD}=\\tfrac12\\overline{AB}=5\\)。"},
{id:"demo-q3",subject:"sci",unitCode:"N9-1",unit:"直線運動",level:"易",
 stem:"一臺玩具車由靜止開始做等加速度直線運動，加速度為 \\(2\\ \\text{m/s}^2\\)。出發後 5 秒內，玩具車移動了多少公尺？",
 options:["10 公尺","20 公尺","25 公尺","50 公尺"],answer:2,
 explain:"由靜止出發，位移 \\[s=\\tfrac12at^2=\\tfrac12\\times2\\times5^2=25\\ \\text{m}\\]選 (A) 10 是把 5 秒末的速度 \\(v=at=10\\ \\text{m/s}\\) 當成距離。"},
{id:"demo-q4",subject:"sci",unitCode:"N8-4",unit:"化學計量",level:"中",
 stem:"氫氣燃燒的反應式為 \\(\\ce{2H2 + O2 -> 2H2O}\\)。若 4 公克的氫氣完全反應，需要多少公克的氧氣？（原子量 H＝1，O＝16）",
 options:["8 公克","16 公克","32 公克","64 公克"],answer:2,
 explain:"\\(\\ce{H2}\\) 的分子量是 2，4 公克就是 2 莫耳。係數比 \\(\\ce{H2}:\\ce{O2}=2:1\\)，所以需要 1 莫耳的 \\(\\ce{O2}\\)，也就是 32 公克。"},
{id:"demo-q5",subject:"sci",unitCode:"N9-5",unit:"電路與歐姆定律",level:"難",
 stem:"兩個 \\(6\\ \\Omega\\) 的電阻並聯後，再與一個 \\(3\\ \\Omega\\) 的電阻串聯，接在 \\(12\\ \\text{V}\\) 的電池上。通過電池的電流是多少安培？",
 options:["1 安培","2 安培","4 安培","6 安培"],answer:1,
 explain:"兩個 6 Ω 並聯等於 \\(\\frac{6\\times6}{6+6}=3\\ \\Omega\\)，再串聯 3 Ω，總電阻 6 Ω。\\[I=\\frac{V}{R}=\\frac{12}{6}=2\\ \\text{A}\\]"}
]};
const FIGS={tri:`<svg viewBox="0 0 260 176" width="260" height="176" role="img" aria-label="直角三角形 ABC，直角在 C，AC 長 6，BC 長 8，D 是斜邊 AB 的中點，虛線連接 C 和 D">
<g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
<path d="M48 150 L224 150 L48 18 Z"/><path d="M48 136 H62 V150"/>
<path class="fig-hi" d="M48 150 L136 84" stroke-dasharray="5 5"/></g>
<g fill="currentColor"><circle cx="136" cy="84" r="3.2" class="fig-dot"/></g>
<g font-size="15" font-family="inherit" fill="currentColor" font-style="italic">
<text x="34" y="16">A</text><text x="230" y="166">B</text><text x="30" y="166">C</text><text x="142" y="78">D</text></g>
<g font-size="13" fill="currentColor" class="fig-mute"><text x="30" y="90">6</text><text x="132" y="170">8</text></g></svg>`};

(()=>{
const CFG=Object.assign({outMs:150,inMs:520,revealDelay:0,countUp:false},window.QCFG||{});
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const L='ABCD',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ICON={ok:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
bad:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
chev:'<svg class="chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
prev:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
next:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
let R=null,busy=false,confirming=false,view='quiz',reported={};
const esc=s=>s;
function math(el){if(window.renderMathInElement){try{renderMathInElement(el,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false})}catch(e){}}}
function start(qs,title,anim){R={title,qs,ans:qs.map(()=>null),i:0,t0:Date.now()};confirming=false;view='quiz';
 document.body.dataset.view='quiz';$('#title').textContent=title;paint(!!anim);window.scrollTo(0,0)}
function strip(){const s=$('#strip');s.innerHTML=R.qs.map((q,n)=>{const a=R.ans[n],st=a===null?'':a===q.answer?'ok':'bad';
 const lab=`第 ${n+1} 題${st==='ok'?'，答對':st==='bad'?'，答錯':'，未作答'}${n===R.i?'，目前這題':''}`;
 return `<button class="bub ${st}${n===R.i?' now':''}" data-n="${n}" aria-label="${lab}"${n===R.i?' aria-current="step"':''}><span class="bub-d"><span class="bub-n">${n+1}</span>${st?`<span class="bub-m">${ICON[st]}</span>`:''}</span></button>`}).join('');
 const done=R.ans.filter(a=>a!==null).length;s.style.setProperty('--done',done/R.qs.length);
 const pg=$('#prog');if(pg)pg.style.setProperty('--p',done/R.qs.length);
 $('#count').innerHTML=`<b>${R.i+1}</b><span> / ${R.qs.length}</span>`}
function card(q,n){const a=R.ans[n],rev=a!==null;
 return `<article class="qcard${rev?' revealed':''}" id="card">
 <div class="qmeta"><span class="qno">第 <b>${n+1}</b> 題</span><span class="tag">${q.unitCode} ${q.unit}</span></div>
 <div class="stem" id="stem" tabindex="-1">${q.stem}</div>
 ${q.fig?`<figure class="fig">${FIGS[q.fig]}</figure>`:''}
 <div class="opts" role="radiogroup" aria-label="選項，用上下鍵選擇，空白鍵確定">${q.options.map((o,k)=>`<button class="opt${optCls(q,a,k)}" role="radio" aria-checked="${rev&&k===a}" tabindex="${k===(rev?a:0)?0:-1}" data-k="${k}" style="--i:${k}"${rev?' aria-disabled="true"':''}><span class="key">${L[k]}</span><span class="txt"><span class="hl" aria-hidden="true"></span><span class="tx">${o}</span></span><span class="mk" aria-hidden="true">${rev&&k===q.answer?ICON.ok:rev&&k===a?ICON.bad:''}</span></button>`).join('')}</div>
 <p class="kb-hint" id="kbh" aria-hidden="true">${hint(rev,n)}</p>
 <div class="fb-slot" id="fb" aria-live="polite">${rev?fb(q,a):''}</div></article>`}
function hint(rev,n){return rev?`<kbd>空白鍵</kbd> ${n===R.qs.length-1?'看結果':'下一題'}`:'<kbd>↑↓</kbd> 選擇 · <kbd>空白鍵</kbd> 確定'}
const optEls=()=>$$('#card .opt'),hiIdx=()=>{const i=optEls().findIndex(b=>b.tabIndex===0);return i<0?0:i};
function setHi(k,focus,noScroll){const o=optEls();if(!o.length)return;k=(k%o.length+o.length)%o.length;o.forEach((b,j)=>b.tabIndex=j===k?0:-1);if(focus)o[k].focus({preventScroll:!!noScroll})}
function optCls(q,a,k){if(a===null)return '';let c='';if(k===q.answer)c+=' ok';if(k===a)c+=' chosen';if(k===a&&a!==q.answer)c+=' bad';if(k!==a&&k!==q.answer)c+=' dim';return c}
function fb(q,a){const ok=a===q.answer;return `<div class="fb ${ok?'is-ok':'is-bad'}">
 <p class="verdict"><span class="vi">${ok?ICON.ok:ICON.bad}</span><span class="vt">${ok?'答對了':`答錯了，正確答案是 ${L[q.answer]}`}</span></p>
 <div class="acc a1"><div class="acc-i"><h3 class="acc-h"><button class="acc-b" aria-expanded="false" aria-controls="acc-p"><span class="t">看詳解</span>${ICON.chev}</button></h3>
 <div class="acc-p" id="acc-p" role="region"><div><div class="acc-tx">${q.explain}</div></div></div></div></div>
 <button class="b5 btn report"${reported[q.id]?' disabled':''}>${reported[q.id]?'已回報':'回報題目有誤'}</button></div>`}
function bar(){const a=R.ans[R.i],last=R.i===R.qs.length-1,un=R.ans.filter(x=>x===null).length;
 $('#prev').disabled=R.i===0;
 const nx=$('#next');nx.disabled=a===null;nx.querySelector('.nx-t').textContent=last?(confirming?'確定交卷':'看結果'):'下一題';
 $('#skip').hidden=a!==null;$('#skip').textContent=last?'略過，看結果':'略過';
 $('#submit').querySelector('span').textContent=confirming?'確定交卷':'交卷';
 const w=$('#warn');if(confirming&&un){w.textContent=`還有 ${un} 題沒寫。確定要交卷嗎？沒寫的題目會算錯。`;w.classList.add('on')}else{w.classList.remove('on')}}
function paint(enter,dir){const q=R.qs[R.i];$('#stage').innerHTML=card(q,R.i);strip();bar();math($('#card'));
 const c=$('#card');if(enter&&!RM.matches){c.style.setProperty('--dir',dir||1);c.classList.add('entering','in');c.offsetWidth;
 requestAnimationFrame(()=>{c.classList.remove('entering');setTimeout(()=>c.classList.remove('in'),900)})}}
function go(n,focusStem){if(n<0||n>=R.qs.length||n===R.i||busy)return;confirming=false;const dir=n>R.i?1:-1;
 const done=()=>{R.i=n;paint(true,dir);const t=$('#card').getBoundingClientRect().top;if(t<0||window.scrollY>0)window.scrollTo({top:0,behavior:RM.matches?'auto':'smooth'});if(focusStem)$('#stem').focus({preventScroll:true});else setHi(hiIdx(),true,true)};
 const c=$('#card');if(RM.matches||!c){done();return}
 busy=true;c.style.setProperty('--dir',dir);c.classList.add('leaving');setTimeout(()=>{busy=false;done()},CFG.outMs)}
function pick(k){const q=R.qs[R.i];if(R.ans[R.i]!==null||busy)return;R.ans[R.i]=k;confirming=false;
 const c=$('#card');c.classList.add('revealed','fresh');
 $$('.opt').forEach((b,j)=>{b.className='opt'+optCls(q,k,j);b.setAttribute('aria-disabled','true');
  b.querySelector('.mk').innerHTML=j===q.answer?ICON.ok:j===k?ICON.bad:'';b.setAttribute('aria-checked',j===k);b.tabIndex=j===k?0:-1});
 $('#kbh').innerHTML=hint(true,R.i);
 const f=$('#fb');f.innerHTML=fb(q,k);math(f);strip();bar();$('#next').focus({preventScroll:true});
 setTimeout(()=>c&&c.classList.remove('fresh'),1200);
 if(!RM.matches){const r=f.getBoundingClientRect(),bh=$('#bar').offsetHeight;if(r.top>innerHeight-bh-80)setTimeout(()=>window.scrollBy({top:Math.min(r.top-(innerHeight-bh-160),r.top-80),behavior:'smooth'}),CFG.revealDelay+260)}}
function next(){if(R.ans[R.i]===null)return;R.i===R.qs.length-1?submit():go(R.i+1)}
function skip(){R.i===R.qs.length-1?submit():go(R.i+1)}
function submit(){const un=R.ans.filter(a=>a===null).length;if(un&&!confirming){confirming=true;bar();return}finish()}
function fmtT(ms){const s=Math.max(1,Math.round(ms/1000)),m=Math.floor(s/60);return m?`${m} 分 ${s%60} 秒`:`${s} 秒`}
function finish(){const total=R.qs.length,correct=R.qs.filter((q,n)=>R.ans[n]===q.answer).length,score=Math.round(correct/total*100),ms=Date.now()-R.t0;
 const wrongQ=R.qs.filter((q,n)=>R.ans[n]!==q.answer);const units={};R.qs.forEach((q,n)=>{const u=units[q.unitCode]||(units[q.unitCode]={code:q.unitCode,unit:q.unit,c:0,t:0});u.t++;if(R.ans[n]===q.answer)u.c++});
 R.res={total,correct,score,ms,wrongQ,units:Object.values(units)};view='result';document.body.dataset.view='result';
 const msg=score===100?'全部答對，這回很穩。':score>=80?'觀念很清楚，錯的那幾題看一下詳解就好。':score>=60?'及格了，把錯題再練一次會更穩。':'先看下面的詳解，再練一次錯題。';
 const st=u=>{const p=u.c/u.t;return p>=.85?['good','掌握']:p>=.6?['mid','部分掌握']:['weak','需加強']};
 const html=`<section class="result${wrongQ.length?' only-wrong':''}" id="result">
 <div class="r-hero"><p class="eyebrow">${R.title}・結果</p>
 <p class="score" aria-label="${score} 分"><span class="num" id="num" data-to="${score}">${score}</span><span class="unit">分</span></p>
 <div class="segs" aria-hidden="true">${R.qs.map((q,n)=>`<i class="${R.ans[n]===q.answer?'ok':'bad'}" style="--i:${n}"></i>`).join('')}</div>
 <p class="msg">${msg}</p></div>
 <div class="stats"><div class="stat"><span>答對</span><b>${correct} / ${total}</b></div><div class="stat"><span>用時</span><b>${fmtT(ms)}</b></div><div class="stat"><span>錯題本</span><b>${wrongQ.length?`+${wrongQ.length} 題加入`:'沒有變化'}</b></div></div>
 <div class="r-grid"><section class="panel units"><h2>本回單元</h2><table class="t1"><thead><tr><th scope="col">單元</th><th scope="col" class="r">答對</th><th scope="col">狀態</th></tr></thead><tbody>
 ${R.res.units.map(u=>{const[s,t]=st(u);return `<tr><td><span class="ucode">${u.code}</span><span class="uname">${u.unit}</span></td><td class="r num">${u.c}/${u.t}</td><td><span class="l2 ${s}"><i></i>${t}</span>${u.t<3?'<span class="l3">題數少</span>':''}</td></tr>`}).join('')}
 </tbody></table></section>
 <section class="panel review"><div class="rv-head"><h2>題目回顧</h2><div class="g1${wrongQ.length?' two':''}" role="tablist" aria-label="篩選"><span class="g1-thumb" aria-hidden="true"></span><button role="tab" aria-selected="${!wrongQ.length}" data-f="all">全部</button><button role="tab" aria-selected="${!!wrongQ.length}" data-f="wrong">只看錯題</button></div></div>
 <ol class="rv-list">${R.qs.map((q,n)=>{const a=R.ans[n],ok=a===q.answer;return `<li class="rv ${ok?'ok':'bad'}"><p class="rv-q"><span class="rv-st">${ok?ICON.ok:ICON.bad}<span>${ok?'對':'錯'}</span></span><span class="rv-n">第 ${n+1} 題</span></p><div class="rv-stem">${q.stem}</div><p class="rv-a">你選：${a===null?'未作答':`(${L[a]}) ${q.options[a]}`}${ok?'':`　正確：(${L[q.answer]}) ${q.options[q.answer]}`}</p>${ok?'':`<div class="rv-ex">${q.explain}</div>`}</li>`}).join('')}</ol></section></div>
 <div class="r-actions"><button class="btn b1" id="retry">${wrongQ.length?`再練錯的 ${wrongQ.length} 題`:'再做一回'}</button><button class="btn b2" id="restart">從頭再做</button><button class="btn b2" id="copy">複製摘要</button><a class="btn b5" href="../">回首頁</a></div></section>`;
 const go2=()=>{$('#stage').innerHTML=html;strip();math($('#result'));window.scrollTo(0,0);const r=$('#result');
  if(!RM.matches){r.classList.add('in');setTimeout(()=>r.classList.remove('in'),1600);if(CFG.countUp)countUp()}};
 const c=$('#card');if(c&&!RM.matches){c.style.setProperty('--dir',1);c.classList.add('leaving');setTimeout(go2,CFG.outMs)}else go2()}
function countUp(){const el=$('#num'),to=+el.dataset.to,t0=performance.now(),D=900;el.textContent='0';
 const f=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function toast(t){const n=$('#toast');n.textContent=t;n.classList.add('on');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('on'),2200)}
function summary(){const d=new Date(),p=x=>String(x).padStart(2,'0'),r=R.res;const weak=r.units.filter(u=>u.c/u.t<.85);
 return `${R.title}結果（${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}）\n當場對｜${r.score} 分（${r.correct}/${r.total}）｜用時 ${fmtT(r.ms)}\n弱點單元：${weak.length?weak.map(u=>`${u.code} ${u.unit} ${u.c}/${u.t}`).join('、'):'無'}\n錯題：${r.wrongQ.length?r.wrongQ.map(q=>`第 ${R.qs.indexOf(q)+1} 題（${q.id}）`).join('、'):'無'}`}
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
 if(t.matches('.opt')){pick(+t.dataset.k);return}
 if(t.matches('.bub')){if(view==='quiz')go(+t.dataset.n,true);return}
 if(t.matches('.acc-b')){const i=t.closest('.acc-i'),o=!i.classList.contains('open');i.classList.toggle('open',o);t.setAttribute('aria-expanded',o);t.querySelector('.t').textContent=o?'收起詳解':'看詳解';return}
 if(t.matches('.report')){reported[R.qs[R.i].id]=1;t.disabled=true;t.textContent='已回報';toast('已回報，謝謝（示範版不會送出）');return}
 if(t.id==='prev'){go(R.i-1);return} if(t.id==='next'){next();return} if(t.id==='skip'){skip();return} if(t.id==='submit'){submit();return}
 if(t.id==='retry'){const w=R.res.wrongQ;start(w.length?[...w].sort(()=>Math.random()-.5):QUIZ.questions.slice(),w.length?'再練錯題':QUIZ.title,true);return}
 if(t.id==='restart'){start(QUIZ.questions.slice(),QUIZ.title,true);return}
 if(t.id==='copy'){const s=summary();(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('已複製摘要'),()=>toast('這個瀏覽器不能自動複製，請長按選取'));return}
 if(t.dataset.f){const w=t.dataset.f==='wrong';$$('.g1 button').forEach(b=>b.setAttribute('aria-selected',b===t));$('.g1').classList.toggle('two',w);$('#result').classList.toggle('only-wrong',w);return}
 if(t.id==='leave'&&view==='quiz'&&R.ans.some(a=>a!==null)){if(!confirm('這回還沒交卷，要離開嗎？')){e.preventDefault()}}});
document.addEventListener('keydown',e=>{const tg=e.target instanceof Element?e.target:document.body;
 if(tg.closest('input,textarea,select,[contenteditable]:not([contenteditable=false])')||e.metaKey||e.ctrlKey||e.altKey||view!=='quiz'||!R)return;
 const k=e.key,opt=tg.closest('.opt'),done=R.ans[R.i]!==null,sp=k===' '||k==='Spacebar';
 if((sp||k==='Enter')&&e.repeat){e.preventDefault();return}
 const m='1234'.indexOf(k)>-1?'1234'.indexOf(k):'abcd'.indexOf(k.toLowerCase());
 if(k.length===1&&m>-1&&m<R.qs[R.i].options.length&&!done){e.preventDefault();setHi(m);pick(m);return}
 if(k==='ArrowDown'||k==='ArrowUp'){if(tg.closest('.g1'))return;e.preventDefault();if(busy)return;setHi(opt?hiIdx()+(k==='ArrowDown'?1:-1):hiIdx(),true);return}
 if(sp||k==='Enter'){
  if(opt){e.preventDefault();done?next():pick(+opt.dataset.k);return}
  if(tg.closest('button,a,summary'))return; /* 其他按鈕（下一題、上一題…）交給瀏覽器原生行為 */
  e.preventDefault();if(done)next();else setHi(hiIdx(),true);return}
 if(k==='ArrowRight'){go(R.i+1)}else if(k==='ArrowLeft'){go(R.i-1)}});
window.addEventListener('DOMContentLoaded',()=>start(QUIZ.questions.slice(),QUIZ.title));
window.__quiz={get R(){return R}};
})();

</script>
</body></html>
