<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13231a">
<title>德撲大廳 · 風格定稿樣張</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  德撲大廳 BD 風格定稿樣張（我的牌桌、可加入的牌桌、開新牌桌主按鈕、3 位房號 A/B）
  只用德撲 tokens（僅衍生透明度）；不使用任何 transform: scale；動效只用 transform / opacity。
  展示用假資料：房號 123 成功，其他 700ms 後顯示「房號不存在」；可加入的牌桌每 2.6 秒模擬人數變動。
-->
<style>
:root{
  /* 德撲 tokens（唯一色源） */
  --page:#13231a; --page2:#21392c; --panel:#101b14;
  --ink:#f3ead2; --mute:#c9bf9f;
  --gold:#d6b45a; --accent:#e6bf5a; --accent2:#c99a2e; --ring:#d6b45a;
  --warn:#ff4d3a;
  /* 線上大廳既有字型與圓角 */
  --tf:"Noto Serif TC","Noto Serif CJK TC",serif;
  --uf:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --radius-sm:8px; --radius-md:12px;
  /* 衍生（只改透明度） */
  --line:rgba(214,180,90,.22);          /* gold 22%：卡片框 */
  --line-in:rgba(214,180,90,.35);       /* gold 35%：輸入框靜止框 */
  --line-hi:rgba(214,180,90,.6);        /* gold 60%：輸入中框 */
  --card:rgba(16,27,20,.72);            /* panel 72%：卡片底 */
  --field:rgba(16,27,20,.9);            /* panel 90%：輸入底 */
  --halo:0 0 0 1px rgba(214,180,90,.38),0 0 0 4px rgba(214,180,90,.12),0 0 16px 2px rgba(214,180,90,.22);
  --halo-err:0 0 0 1px rgba(255,77,58,.34),0 0 0 4px rgba(255,77,58,.10),0 0 16px 2px rgba(255,77,58,.18);
  /* 動效 */
  --ease:cubic-bezier(.2,.7,.2,1);
  --t:.22s;
}
*{box-sizing:border-box;margin:0}
html{background:var(--panel);-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
body{
  min-height:100vh;min-height:100dvh;font-family:var(--uf);color:var(--ink);line-height:1.5;
  background:radial-gradient(ellipse 120% 80% at 50% 30%,var(--page2) 0%,var(--page) 70%,var(--panel) 100%);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-x:clip;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
::selection{background:var(--accent);color:var(--panel)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{max-width:560px;margin:0 auto;padding:12px 16px 40px;padding-top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:14px;min-height:100dvh}

/* ── 樣張切換（只為試用，非正式 UI） ── */
.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:8px 10px;border-radius:var(--radius-md);border:1px dashed rgba(214,180,90,.35);background:rgba(16,27,20,.5)}
.demo small{font-size:12px;color:var(--mute);white-space:nowrap}
.demo .grp{display:flex;align-items:center;gap:8px;min-width:0}
.tgl{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute);background:rgba(16,27,20,.85);white-space:nowrap;transition:color var(--t) var(--ease),border-color var(--t) var(--ease),background-color var(--t) var(--ease)}
.tgl[aria-pressed="true"]{color:var(--accent);border-color:rgba(230,191,90,.55)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:rgba(16,27,20,.85);border:1px solid var(--line);min-width:0;width:176px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:38px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap;transition:color var(--t) var(--ease)}
.seg input:checked+label{color:var(--panel)}
.seg input:focus-visible+label{outline:2px solid var(--ring);outline-offset:3px}
.seg .knob{position:absolute;top:3px;left:3px;bottom:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(var(--accent),var(--accent2));transition:transform var(--t) var(--ease)}
.seg[data-v="B"] .knob{transform:translateX(100%)}

/* ── 頂部 ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;min-width:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--tf);font-size:17px;color:var(--ink);background:rgba(16,27,20,.9);border:2px solid var(--gold)}
.bal{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--mute);gap:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal strong{color:var(--ink);font-size:13px}

.cols{display:flex;flex-direction:column;gap:14px}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-h h2{font-size:15px;font-weight:700;letter-spacing:.02em}
.sec-h span{font-size:12px;color:var(--mute)}

.card{padding:16px;border-radius:var(--radius-md);background:var(--card);border:1px solid var(--line)}
.card h3{font-size:16px;font-weight:700;margin-bottom:8px}

/* ── 清單面板（我的牌桌、可加入的牌桌共用） ── */
.panel{border-radius:var(--radius-md);background:var(--card);border:1px solid var(--line);padding:6px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 6px}
.panel-h h2{font-size:15px;font-weight:700;letter-spacing:.02em}
.panel-h span{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:live 2.4s var(--ease) infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.rows{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.row{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:64px;padding:10px;text-align:left;border-radius:var(--radius-sm);
  background:transparent;border:1px solid transparent;
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.rows li+li{border-top:1px solid rgba(214,180,90,.10)}
@media (hover:hover) and (pointer:fine){
  .row:hover{background:rgba(214,180,90,.06);border-color:rgba(214,180,90,.28)}
  .row:hover .go svg{transform:translateX(2px)}
}
.row:active{background:rgba(16,27,20,.9);border-color:rgba(214,180,90,.4);box-shadow:inset 0 1px 3px rgba(16,27,20,.7);transition-duration:.06s}
.row:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.hav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--tf);font-size:15px;font-weight:700;color:var(--ink);background:rgba(16,27,20,.95);border:1.5px solid rgba(214,180,90,.7)}
.row .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .l1{display:flex;align-items:center;gap:8px;min-width:0}
.row b{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row em{font-style:normal;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .blinds{font-size:13px;font-weight:700;color:var(--ink)}
.row .blinds small{font-size:11px;font-weight:400;color:var(--mute);margin-right:4px}
.seats{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.pips{display:flex;gap:3px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.18;transition:opacity var(--t) var(--ease)}
.pips i.on{opacity:1}
.n{display:inline-block;min-width:2.6em;text-align:right;transition:opacity .11s var(--ease)}
.n.swap{opacity:0}
.tag{flex:none;font-size:11px;font-weight:700;line-height:18px;padding:0 7px;border-radius:999px;color:var(--mute);border:1px solid rgba(201,191,159,.4);background:rgba(201,191,159,.08);transition:opacity var(--t) var(--ease)}
.row.full .hav{border-color:rgba(201,191,159,.45)}
.row.full .pips i{background:var(--mute)}
.row.full .blinds{color:var(--mute)}
.row:not(.full) .tag{display:none}
.go{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}
.go svg{width:16px;height:16px;transition:transform var(--t) var(--ease)}
.row[aria-busy="true"] .go{color:var(--mute)}
.mine .dot{justify-self:center;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(230,191,90,.18)}
.mine .dot.idle{background:var(--mute);box-shadow:0 0 0 3px rgba(201,191,159,.14)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:20;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;font-size:14px;color:var(--ink);background:rgba(16,27,20,.94);border:1px solid rgba(214,180,90,.35);box-shadow:0 8px 24px rgba(16,27,20,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transform:translate(-50%,8px);transition:opacity var(--t) var(--ease),transform var(--t) var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* E1 空狀態 */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 16px 22px}
.empty svg{width:132px;height:88px;margin-bottom:6px}
.empty h3{font-size:15px;font-weight:700}
.empty p{font-size:13px;color:var(--mute)}

/* ── 主按鈕：開新牌桌 ── */
.btn-primary{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border-radius:var(--radius-md);
  font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--panel);
  background:linear-gradient(180deg,var(--accent) 0%,var(--accent2) 100%);
  box-shadow:inset 0 1px 0 rgba(243,234,210,.45),0 1px 2px rgba(16,27,20,.5),0 8px 20px -8px rgba(201,154,46,.55);
  transition:box-shadow var(--t) var(--ease)}
.btn-primary::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--panel);opacity:0;pointer-events:none;transition:opacity var(--t) var(--ease)}
.btn-primary svg{width:18px;height:18px;flex:none}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{box-shadow:inset 0 1px 0 rgba(243,234,210,.55),0 1px 2px rgba(16,27,20,.5),0 12px 26px -8px rgba(201,154,46,.7)}
}
.btn-primary:active{box-shadow:inset 0 2px 4px rgba(16,27,20,.35),0 0 0 rgba(16,27,20,0);transition-duration:.06s}
.btn-primary:active::after{opacity:.16;transition-duration:.06s}
.btn-primary:focus-visible{outline:2px solid var(--ring);outline-offset:3px}

/* ── 房號輸入（次要入口，安靜版） ── */
.join{padding:12px 14px;border-radius:var(--radius-md);border:1px solid rgba(214,180,90,.16);background:transparent}
.join .jr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.join .jt{min-width:0}
.join label.lbl{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.join .sub{display:block;font-size:12px;color:var(--mute)}
.status{display:flex;align-items:center;gap:8px;height:20px;margin-top:8px;font-size:13px;line-height:20px;color:var(--mute);white-space:nowrap;overflow:hidden}
.status[data-s="error"]{color:var(--warn)}
.status[data-s="success"]{color:var(--accent)}
.status .ico{flex:none;width:14px;height:14px}
.status .msg{overflow:hidden;text-overflow:ellipsis}
.spin{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(214,180,90,.28);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#stA .spin{display:none} /* A 的轉圈在框內，狀態列只留文字 */
.again{font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;padding:0 2px;margin-left:auto;min-height:20px}

/* A：單框寬字距 */
.fa{position:relative;flex:none;width:148px}
.fa input{display:block;width:100%;height:48px;padding:0 28px;border-radius:var(--radius-sm);
  font-family:var(--uf);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5em;text-indent:.5em;text-align:center;
  color:var(--ink);background:var(--field);border:1px solid var(--line-in);outline:none;-webkit-appearance:none;appearance:none;caret-color:var(--accent);
  transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.fa input::placeholder{font-size:16px;font-weight:400;letter-spacing:.3em;text-indent:.3em;color:rgba(201,191,159,.5)}
@media (hover:hover) and (pointer:fine){.fa input:hover:not(:focus){border-color:rgba(214,180,90,.5)}}
.fa input:focus{border-color:var(--gold);box-shadow:var(--halo)}
.fa[data-s="typing"] input{border-color:var(--line-hi)}
.fa[data-s="typing"] input:focus{border-color:var(--gold)}
.fa[data-s="joining"] input{color:rgba(243,234,210,.6);border-color:var(--line-hi)}
.fa[data-s="error"] input{border-color:var(--warn)}
.fa[data-s="error"] input:focus{box-shadow:var(--halo-err)}
.fa[data-s="success"] input{border-color:var(--accent);color:var(--accent)}
.fa .slot-r{position:absolute;right:10px;top:50%;width:16px;height:16px;margin-top:-8px;display:grid;place-items:center;pointer-events:none}
.fa .slot-r>*{grid-area:1/1;opacity:0;transition:opacity var(--t) var(--ease)}
.fa[data-s="joining"] .slot-r .spin{opacity:1}
.fa[data-s="success"] .slot-r .ok{opacity:1}
.fa .slot-r .ok{width:16px;height:16px;color:var(--accent)}

/* B：三格（一個真 input 驅動） */
.fb{position:relative;flex:none}
.fb .cells{display:grid;grid-template-columns:repeat(3,44px);gap:8px;pointer-events:none}
.fb .cell{position:relative;height:48px;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--field);border:1px solid var(--line-in);
  font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);
  transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.fb .cell.filled{border-color:var(--line-hi)}
.fb .cell .caret{position:absolute;left:50%;top:50%;width:2px;height:22px;margin:-11px 0 0 -1px;border-radius:1px;background:var(--accent);opacity:0}
.fb.focus .cell.cur{border-color:var(--gold);box-shadow:var(--halo)}
.fb.focus .cell.cur .caret{animation:blink 1.06s steps(1,end) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.fb.focus.all .cell{border-color:var(--gold)}
.fb[data-s="error"].focus.all .cell{border-color:var(--warn);box-shadow:var(--halo-err)}
.fb[data-s="joining"] .cell{color:rgba(243,234,210,.6);border-color:var(--line-hi);box-shadow:none}
.fb[data-s="error"] .cell{border-color:var(--warn)}
.fb[data-s="error"].focus .cell.cur{box-shadow:var(--halo-err)}
.fb[data-s="success"] .cell{border-color:var(--accent);color:var(--accent)}
.fb input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;outline:none;background:transparent;
  font-size:16px;color:transparent;-webkit-text-fill-color:transparent;caret-color:transparent;letter-spacing:0;opacity:.01;cursor:text}
.fb input::selection{background:transparent}
@media (hover:hover) and (pointer:fine){.fb:hover:not(.focus) .cell{border-color:rgba(214,180,90,.5)}}

.hint{font-size:12px;color:var(--mute);margin-top:-6px;padding:0 2px}

/* ── 戰績 ── */
.ranks{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.ranks li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.foot{display:flex;justify-content:space-between;margin-top:auto;padding-top:20px;gap:8px}
.link{color:var(--mute);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:8px;min-height:44px}

[hidden]{display:none!important}

@media (min-width:1024px){
  .shell{max-width:1080px;padding:28px 32px}
  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important;animation-iteration-count:1!important}
  .live-dot{animation:none!important}
  .spin{animation:none!important;border-color:rgba(214,180,90,.28);border-top-color:var(--accent);border-right-color:var(--accent)}
  .fb.focus .cell.cur .caret{animation:none!important;opacity:1}
}
</style>
</head>
<body>
<div class="shell">

  <div class="demo" role="group" aria-label="樣張控制（正式版沒有）">
    <div class="grp"><small>房號樣式</small>
      <div class="seg" id="seg" data-v="A">
        <span class="knob" aria-hidden="true"></span>
        <input type="radio" name="variant" id="vA" value="A" checked><label for="vA">A 單框</label>
        <input type="radio" name="variant" id="vB" value="B"><label for="vB">B 三格</label>
      </div>
    </div>
    <button type="button" class="tgl" id="tglEmpty" aria-pressed="false">清單空狀態</button>
  </div>

  <header class="top">
    <div class="who"><span class="av" aria-hidden="true">謝</span><span>謝宗良</span></div>
    <div class="bal"><span>帳戶 0</span><span>牌桌中 2,000</span><strong>總計 2,000</strong></div>
  </header>

  <div class="cols">
    <div class="main">

      <section class="panel mine" aria-labelledby="myH">
        <div class="panel-h"><h2 id="myH">我的牌桌</h2><span>點一下回座</span></div>
        <ul class="rows">
          <li><button type="button" class="row" data-name="週五牌局" data-act="seat">
            <span class="dot" aria-hidden="true"></span>
            <span class="txt"><span class="l1"><b>週五牌局</b></span><em>房號 482 · 座位 3 · 籌碼 1,840</em></span>
            <span class="go"><span class="go-t">回座</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></span>
          </button></li>
        </ul>
      </section>

      <section class="panel open" aria-labelledby="openH">
        <div class="panel-h"><h2 id="openH">可加入的牌桌</h2><span id="openCount"><i class="live-dot" aria-hidden="true"></i><span id="openN">5</span> 桌 · 即時</span></div>
        <ul class="rows" id="openList"></ul>
        <div class="empty" id="openEmpty" hidden>
          <svg viewBox="0 0 132 88" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="66" cy="80" rx="46" ry="4.5" fill="rgba(16,27,20,.9)"/>
            <ellipse cx="66" cy="46" rx="48" ry="24" stroke="rgba(214,180,90,.55)" stroke-width="1.6" fill="rgba(33,57,44,.55)"/>
            <ellipse cx="66" cy="46" rx="38" ry="17" stroke="rgba(214,180,90,.22)" stroke-width="1.2"/>
            <circle cx="56" cy="44" r="6" stroke="rgba(230,191,90,.75)" stroke-width="1.4"/><circle cx="56" cy="44" r="2.4" stroke="rgba(230,191,90,.45)" stroke-width="1.2"/>
            <rect x="68" y="37" width="12" height="16" rx="2" stroke="rgba(243,234,210,.6)" stroke-width="1.4"/>
            <path d="M108 16v6M105 19h6" stroke="rgba(230,191,90,.7)" stroke-width="1.4"/><circle cx="22" cy="20" r="2.5" stroke="rgba(201,191,159,.6)" stroke-width="1.3"/>
          </svg>
          <h3>現在沒有牌桌，開一桌吧</h3>
          <p>開好之後，家人登入就會在這裡看到。</p>
        </div>
      </section>

    </div>
    <div class="main">

      <button type="button" class="btn-primary" id="btnCreate">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11"/></svg>開新牌桌
      </button>

      <!-- A：單框 -->
      <section class="join" id="joinA">
        <div class="jr">
          <div class="jt"><label class="lbl" for="codeA">有房號？</label><span class="sub">輸入 3 位數直接加入</span></div>
          <div class="fa" id="fa" data-s="empty">
            <input id="codeA" name="roomcode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3"
              autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
              placeholder="000" aria-describedby="stA">
            <span class="slot-r" aria-hidden="true"><span class="spin"></span>
              <svg class="ok" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 7.5 13 14 5.5"/></svg></span>
          </div>
        </div>
        <div class="status" id="stA" data-s="empty" aria-live="polite"><span class="msg">打滿 3 位會自動加入</span></div>
      </section>

      <!-- B：三格 -->
      <section class="join" id="joinB" hidden>
        <div class="jr">
          <div class="jt"><label class="lbl" for="codeB">有房號？</label><span class="sub">輸入 3 位數直接加入</span></div>
          <div class="fb" id="fb" data-s="empty">
            <div class="cells" aria-hidden="true">
              <span class="cell"><span class="digit"></span><span class="caret"></span></span>
              <span class="cell"><span class="digit"></span><span class="caret"></span></span>
              <span class="cell"><span class="digit"></span><span class="caret"></span></span>
            </div>
            <input id="codeB" name="roomcode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3"
              autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
              aria-describedby="stB">
          </div>
        </div>
        <div class="status" id="stB" data-s="empty" aria-live="polite"><span class="msg">打滿 3 位會自動加入，可直接貼上</span></div>
      </section>
      <p class="hint">樣張：輸入 <b>123</b> 會成功，其他號碼約 0.7 秒後顯示「房號不存在」。</p>

      <article class="card" aria-labelledby="stH">
        <h3 id="stH">戰績</h3>
        <ol class="ranks"><li><span>1. 謝宗良</span><b>2,000</b></li><li><span>2. 阿姨</span><b>1,420</b></li></ol>
      </article>

    </div>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <footer class="foot">
    <button type="button" class="link">同一支手機輪流玩</button>
    <button type="button" class="link">登出</button>
  </footer>
</div>

<script>
(() => {
  const LEN = 3, DEMO_OK = '123', DELAY = 700;
  const ICON = {
    err: '<svg class="ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5.6"/><path d="M7 4.2v3.4M7 9.7v.1"/></svg>',
    ok: '<svg class="ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4 5.8 10 11 4.2"/></svg>'
  };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ── 房號輸入（A/B 共用狀態機） ── */
  function makeJoin({ input, wrap, status, idleMsg, onRender }) {
    let state = 'empty', timer = 0;
    const set = (s, html) => {
      state = s; wrap.dataset.s = s; status.dataset.s = s; status.innerHTML = html;
      input.readOnly = s === 'joining' || s === 'success';
      input.setAttribute('aria-invalid', s === 'error' ? 'true' : 'false');
      wrap.setAttribute('aria-busy', s === 'joining' ? 'true' : 'false');
      const again = status.querySelector('.again');
      if (again) again.addEventListener('click', reset);
      onRender && onRender();
    };
    const idle = () => {
      const n = input.value.length;
      if (!n) set('empty', `<span class="msg">${idleMsg}</span>`);
      else set('typing', `<span class="msg">還差 ${LEN - n} 位</span>`);
    };
    const join = () => {
      const code = input.value;
      set('joining', '<span class="spin" aria-hidden="true"></span><span class="msg">加入中…</span>');
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (code === DEMO_OK) set('success', `${ICON.ok}<span class="msg">已加入「週五牌局」</span><button type="button" class="again">再試一次</button>`);
        else {
          set('error', `${ICON.err}<span class="msg">房號 ${code} 不存在，請再確認</span>`);
          if (document.activeElement === input) { input.select(); onRender && onRender(); }
        }
      }, DELAY);
    };
    const sanitize = (raw) => (raw || '').replace(/\D/g, '').slice(0, LEN);
    input.addEventListener('input', () => {
      if (state === 'joining' || state === 'success') return;
      const v = sanitize(input.value);
      if (v !== input.value) input.value = v;
      if (v.length === LEN) join(); else idle();
    });
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      if (state === 'joining' || state === 'success') return;
      const t = (e.clipboardData && e.clipboardData.getData('text')) || '';
      const m = t.match(/room=(\d{3})(?!\d)/i) || t.match(/(?:^|\D)(\d{3})(?:\D|$)/);
      if (m) input.value = m[1];
      else {
        const a = input.selectionStart ?? input.value.length, b = input.selectionEnd ?? a;
        input.value = sanitize(input.value.slice(0, a) + t + input.value.slice(b));
      }
      input.dispatchEvent(new Event('input', { bubbles: true }));
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && state === 'error' && input.value.length === LEN) { e.preventDefault(); join(); }
    });
    function reset() { clearTimeout(timer); input.readOnly = false; input.value = ''; idle(); }
    idle();
    return { reset, get state() { return state; } };
  }

  const A = makeJoin({ input: document.getElementById('codeA'), wrap: document.getElementById('fa'),
    status: document.getElementById('stA'), idleMsg: '打滿 3 位會自動加入' });

  const fb = document.getElementById('fb'), inB = document.getElementById('codeB');
  const cells = [...fb.querySelectorAll('.cell')];
  const renderB = () => {
    const v = inB.value, err = fb.dataset.s === 'error';
    const all = err && v.length === LEN && inB.selectionStart === 0 && inB.selectionEnd === LEN;
    fb.classList.toggle('all', all);
    cells.forEach((c, i) => {
      c.querySelector('.digit').textContent = v[i] || '';
      c.classList.toggle('filled', !!v[i]);
      c.classList.toggle('cur', !all && v.length < LEN && i === v.length);
    });
  };
  const B = makeJoin({ input: inB, wrap: fb, status: document.getElementById('stB'),
    idleMsg: '打滿 3 位會自動加入，可直接貼上', onRender: renderB });
  const toEnd = () => { if (fb.dataset.s !== 'error') { const n = inB.value.length; inB.setSelectionRange(n, n); } renderB(); };
  inB.addEventListener('focus', () => { fb.classList.add('focus'); requestAnimationFrame(toEnd); });
  inB.addEventListener('blur', () => fb.classList.remove('focus'));
  inB.addEventListener('click', toEnd);
  inB.addEventListener('keyup', renderB);
  document.addEventListener('selectionchange', () => { if (document.activeElement === inB) renderB(); });
  renderB();

  const seg = document.getElementById('seg');
  seg.addEventListener('change', (e) => {
    const v = e.target.value; seg.dataset.v = v;
    document.getElementById('joinA').hidden = v !== 'A';
    document.getElementById('joinB').hidden = v !== 'B';
    A.reset(); B.reset();
  });

  /* ── 可加入的牌桌（假資料＋即時人數） ── */
  const tables = [
    { id: 't1', name: '週六家族盃', host: '阿姨', code: '317', bb: '10/20', seated: 3 },
    { id: 't2', name: '高手過招', host: '小舅', code: '905', bb: '50/100', seated: 6 },
    { id: 't3', name: '練習桌（新手歡迎）', host: '表哥', code: '264', bb: '5/10', seated: 2 },
    { id: 't4', name: '下班小玩', host: '阿明', code: '738', bb: '10/20', seated: 5 },
    { id: 't5', name: '深夜場', host: '小美', code: '051', bb: '25/50', seated: 4 }
  ];
  const list = document.getElementById('openList');
  const pips = (n) => Array.from({ length: 6 }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
  const label = (t) => `${t.name}，房主 ${t.host}，盲注 ${t.bb}，${t.seated} / 6 人，房號 ${t.code}${t.seated >= 6 ? '，已滿，可觀戰' : ''}`;
  list.innerHTML = tables.map((t) => `
    <li><button type="button" class="row${t.seated >= 6 ? ' full' : ''}" data-id="${t.id}" aria-label="${esc(label(t))}">
      <span class="hav" aria-hidden="true">${esc(t.host[0])}</span>
      <span class="txt" aria-hidden="true">
        <span class="l1"><b>${esc(t.name)}</b><span class="tag">已滿，可觀戰</span></span>
        <em>${esc(t.host)} 開桌 · 房號 ${esc(t.code)}</em>
      </span>
      <span class="side" aria-hidden="true">
        <span class="blinds"><small>盲注</small>${esc(t.bb)}</span>
        <span class="seats"><span class="pips">${pips(t.seated)}</span><span class="n">${t.seated}/6</span></span>
      </span>
    </button></li>`).join('');

  function setSeated(t, n) {
    t.seated = n;
    const row = list.querySelector(`[data-id="${t.id}"]`);
    row.querySelectorAll('.pips i').forEach((p, i) => p.classList.toggle('on', i < n));
    const num = row.querySelector('.n');
    num.classList.add('swap');
    setTimeout(() => { num.textContent = `${n}/6`; num.classList.remove('swap'); }, 110);
    row.classList.toggle('full', n >= 6);
    row.setAttribute('aria-label', label(t));
  }
  let tick = setInterval(() => {
    const t = tables[Math.floor(Math.random() * tables.length)];
    let d = Math.random() < 0.5 ? -1 : 1;
    if (t.seated + d > 6 || t.seated + d < 1) d = -d;
    setSeated(t, t.seated + d);
  }, 2600);

  const tgl = document.getElementById('tglEmpty');
  tgl.addEventListener('click', () => {
    const on = tgl.getAttribute('aria-pressed') !== 'true';
    tgl.setAttribute('aria-pressed', String(on));
    list.hidden = on;
    document.getElementById('openEmpty').hidden = !on;
    document.getElementById('openN').textContent = on ? 0 : tables.length;
  });

  /* ── 點列：回座／進桌觀戰 ── */
  const toast = document.getElementById('toast'); let tt = 0;
  const flash = (_, msg) => { toast.textContent = msg; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 2200); };
  document.querySelector('.mine .row').addEventListener('click', function () {
    if (this.getAttribute('aria-busy') === 'true') return;
    this.setAttribute('aria-busy', 'true');
    const t = this.querySelector('.go-t'); t.textContent = '回座中…';
    setTimeout(() => { this.removeAttribute('aria-busy'); t.textContent = '回座'; flash(null, `（樣張）已回到「${this.dataset.name}」`); }, DELAY);
  });
  list.addEventListener('click', (e) => {
    const row = e.target.closest('.row'); if (!row) return;
    const t = tables.find((x) => x.id === row.dataset.id);
    flash(null, t.seated >= 6 ? `（樣張）進入「${t.name}」觀戰` : `（樣張）進入「${t.name}」，點空位入座`);
  });
  document.getElementById('btnCreate').addEventListener('click', () => flash(null, '（樣張）開新牌桌 → 進入開房頁'));

  window.__demo = { A, B, tables, setSeated, stop: () => clearInterval(tick) };
})();
</script>
</body>
</html>
