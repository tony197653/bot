<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13231a">
<title>德撲大廳 · 風格定稿樣張</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  德撲大廳 BD 風格定稿樣張（頂部名字下的狀態列＋帳戶／牌桌金額框＋功能清單、我的牌桌卡 4 種狀態、自動離座 toast、可加入的牌桌、開新牌桌主按鈕、3 位房號 B 三格）
  只用德撲 tokens（僅衍生透明度）；按下／hover／選取只變顏色、陰影、透明度，不縮放、不位移；動畫只用 opacity。
  展示用假資料：房號 123 成功，其他 700ms 後顯示「房號不存在」；可加入的牌桌每 2.6 秒模擬人數變動。
-->
<style>
:root{
  /* 德撲 tokens（唯一色源） */
  --page:#13231a; --page2:#21392c; --panel:#101b14;
  --ink:#f3ead2; --mute:#c9bf9f;
  --gold:#d6b45a; --accent:#e6bf5a; --accent2:#c99a2e; --ring:#d6b45a;
  --warn:#ff7566;
  /* 線上大廳既有字型與圓角 */
  --tf:"Noto Serif TC","Noto Serif CJK TC",serif;
  --uf:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --radius-sm:8px; --radius-md:12px;
  /* 衍生（只改透明度） */
  --line:rgba(214,180,90,.22);          /* gold 22%：卡片框 */
  --line-in:rgba(214,180,90,.35);       /* gold 35%：輸入框靜止框 */
  --line-hi:rgba(214,180,90,.6);        /* gold 60%：輸入中框 */
  --card:rgba(16,27,20,.72);            /* panel 72%：卡片底 */
  --field:rgba(16,27,20,.9);            /* panel 90%：輸入底 */
  --halo:0 0 0 1px rgba(214,180,90,.38),0 0 0 4px rgba(214,180,90,.12),0 0 16px 2px rgba(214,180,90,.22);
  --halo-err:0 0 0 1px rgba(255,117,102,.34),0 0 0 4px rgba(255,117,102,.10),0 0 16px 2px rgba(255,117,102,.18);
  /* 動效 */
  --ease:cubic-bezier(.2,.7,.2,1);
  --t:.22s;
}
*{box-sizing:border-box;margin:0}
html{background:var(--panel);-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
body{
  min-height:100vh;min-height:100dvh;font-family:var(--uf);color:var(--ink);line-height:1.5;
  background:radial-gradient(ellipse 120% 80% at 50% 30%,var(--page2) 0%,var(--page) 70%,var(--panel) 100%);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-x:clip;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
::selection{background:var(--accent);color:var(--panel)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{max-width:560px;margin:0 auto;padding:12px 16px 40px;padding-top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:14px;min-height:100dvh}

/* ── 頂部 ── */
/* 頂部：頭像｜名字／狀態｜帳戶／牌桌金額框｜功能清單鈕（兩列格線，高度固定） */
.top{position:relative;z-index:25;display:grid;grid-template-columns:50px fit-content(10em) auto minmax(0,1fr) 44px;grid-template-rows:24px 24px;column-gap:4px;row-gap:2px;align-items:center;height:50px}
.av{grid-row:1/3;grid-column:1;justify-self:start;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--tf);font-size:17px;color:var(--ink);background:rgba(16,27,20,.9);border:2px solid var(--gold)}
.nm{grid-row:1;grid-column:2;min-width:0;font-size:16px;font-weight:700;line-height:24px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 狀態：純文字，不可點、沒有點、沒有箭頭、沒有框；和名字同一條中心線 */
.stl{grid-row:2;grid-column:2;min-width:4em;height:24px;line-height:24px;font-size:13px;font-weight:500;color:var(--mute);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{grid-column:3;width:112px;height:24px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;border-radius:var(--radius-sm);
  border:1px solid rgba(214,180,90,.38);background:rgba(16,27,20,.55);white-space:nowrap}
#amtAcc{grid-row:1}#amtTab{grid-row:2}
.amt small{font-size:11.5px;color:var(--mute)}
.amt b{font-size:14.5px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right;transition:opacity .11s var(--ease)}
.amt b.swap{opacity:0}
.amt b.zero{color:var(--mute);font-weight:500}
#amtAcc{grid-row:1}#amtTab{grid-row:2}
.mw{grid-row:1/3;grid-column:5;position:relative;width:44px;height:44px}
.mbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--radius-md);color:var(--ink);border:1px solid rgba(214,180,90,.3);background:rgba(16,27,20,.55);
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.mbtn svg{width:20px;height:20px}
@media (hover:hover) and (pointer:fine){.mbtn:hover{background:rgba(214,180,90,.1);border-color:rgba(214,180,90,.5)}}
.mbtn:active{background:rgba(16,27,20,.9);box-shadow:inset 0 1px 3px rgba(16,27,20,.7);transition-duration:.06s}
.mbtn[aria-expanded="true"]{border-color:var(--gold);background:rgba(214,180,90,.12)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:216px;padding:6px;border-radius:var(--radius-md);list-style:none;
  background:rgba(16,27,20,.97);border:1px solid rgba(214,180,90,.32);box-shadow:0 14px 34px -8px rgba(16,27,20,.8),0 2px 6px rgba(16,27,20,.5);
  opacity:0;visibility:hidden;transition:opacity .18s var(--ease),visibility 0s linear .18s}
.menu.on{opacity:1;visibility:visible;transition:opacity var(--t) var(--ease),visibility 0s}
.mi{width:100%;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:var(--radius-sm);font-size:14.5px;text-align:left;color:var(--ink);white-space:nowrap;
  transition:background-color var(--t) var(--ease),color var(--t) var(--ease)}
.mi svg{width:18px;height:18px;flex:none;color:var(--mute)}
.mi.pri{font-weight:700;color:var(--accent)}
.mi.pri svg{color:var(--accent)}
.mi.pri.settle{color:var(--ink)}
.mi .num{color:var(--gold);font-variant-numeric:tabular-nums}
.mi:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
@media (hover:hover) and (pointer:fine){.mi:hover{background:rgba(214,180,90,.08)}}
.mi:active{background:rgba(214,180,90,.14);transition-duration:.06s}
.menu .sep{height:1px;margin:4px 8px;background:rgba(214,180,90,.14)}
.menu .sep[hidden]{display:none}

.cols{display:flex;flex-direction:column;gap:14px}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-h h2{font-size:15px;font-weight:700;letter-spacing:.02em}
.sec-h span{font-size:12px;color:var(--mute)}

.card{padding:16px;border-radius:var(--radius-md);background:var(--card);border:1px solid var(--line)}
.card h3{font-size:16px;font-weight:700;margin-bottom:8px}

/* ── 清單面板（我的牌桌、可加入的牌桌共用） ── */
.panel{border-radius:var(--radius-md);background:var(--card);border:1px solid var(--line);padding:6px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 6px}
.panel-h h2{font-size:15px;font-weight:700;letter-spacing:.02em}
.panel-h span{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:live 2.4s var(--ease) infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.rows{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.row{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:64px;padding:10px;text-align:left;border-radius:var(--radius-sm);
  background:transparent;border:1px solid transparent;
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.rows li+li{border-top:1px solid rgba(214,180,90,.10)}
@media (hover:hover) and (pointer:fine){
  .row:hover{background:rgba(214,180,90,.06);border-color:rgba(214,180,90,.28)}
  .row:hover .go svg{opacity:1}
}
.row:active{background:rgba(16,27,20,.9);border-color:rgba(214,180,90,.4);box-shadow:inset 0 1px 3px rgba(16,27,20,.7);transition-duration:.06s}
.row:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.hav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--tf);font-size:15px;font-weight:700;color:var(--ink);background:rgba(16,27,20,.95);border:1.5px solid rgba(214,180,90,.7)}
.row .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .l1{display:flex;align-items:center;gap:8px;min-width:0}
.row b{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row em{font-style:normal;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .blinds{font-size:13px;font-weight:700;color:var(--ink)}
.row .blinds small{font-size:11px;font-weight:400;color:var(--mute);margin-right:4px}
.seats{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.pips{display:flex;gap:3px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.18;transition:opacity var(--t) var(--ease)}
.pips i.on{opacity:1}
.n{display:inline-block;min-width:2.6em;text-align:right;transition:opacity .11s var(--ease)}
.n.swap{opacity:0}
.tag{flex:none;font-size:11px;font-weight:700;line-height:18px;padding:0 7px;border-radius:999px;color:var(--mute);border:1px solid rgba(201,191,159,.4);background:rgba(201,191,159,.08);transition:opacity var(--t) var(--ease)}
.row.full .hav{border-color:rgba(201,191,159,.45)}
.row.full .pips i{background:var(--mute)}
.row.full .blinds{color:var(--mute)}
.row:not(.full) .tag{display:none}
.go{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}
.go svg{width:16px;height:16px;opacity:.7;transition:opacity var(--t) var(--ease)}

/* ── 我的牌桌卡（整張是一顆按鈕；回到牌桌／結帳離開） ── */
.mine{transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.mine.attn{border-color:rgba(214,180,90,.6);box-shadow:0 0 0 1px rgba(214,180,90,.38),0 0 18px 2px rgba(214,180,90,.2)}
.my{width:100%;display:flex;flex-direction:column;gap:10px;padding:10px;text-align:left;border-radius:var(--radius-sm);border:1px solid transparent;
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.my .mt{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.my .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.my .l1{display:flex;align-items:center;gap:8px;min-width:0}
.my .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(230,191,90,.18)}
.my b{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.my em{font-style:normal;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.my .lbl3{flex:none;font-size:11px;font-weight:700;line-height:18px;padding:0 7px;border-radius:999px;color:var(--accent);border:1px solid rgba(230,191,90,.45);background:rgba(230,191,90,.08)}
.my .chips-n{display:flex;flex-direction:column;align-items:flex-end;gap:0;white-space:nowrap}
.my .chips-n small{font-size:11px;color:var(--mute)}
.my .chips-n strong{font-size:18px;font-weight:700;line-height:1.3;color:var(--gold);font-variant-numeric:tabular-nums}
.my .act{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;letter-spacing:.02em;
  color:var(--accent);background:rgba(230,191,90,.12);border:1px solid rgba(230,191,90,.45);
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.my .act svg{width:16px;height:16px;flex:none}
.my .act .num{color:var(--gold);font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){
  .my:hover{background:rgba(214,180,90,.06);border-color:rgba(214,180,90,.28)}
  .my:hover .act{background:rgba(230,191,90,.18);border-color:rgba(230,191,90,.65)}
}
.my:active{background:rgba(16,27,20,.9);border-color:rgba(214,180,90,.4);box-shadow:inset 0 1px 3px rgba(16,27,20,.7);transition-duration:.06s}
.my:active .act{background:rgba(16,27,20,.6);box-shadow:inset 0 1px 3px rgba(16,27,20,.7);transition-duration:.06s}
.my:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.my[aria-busy="true"] .act{color:var(--mute);border-color:rgba(201,191,159,.35);background:transparent}
/* 已收桌待結帳：安靜，沒有亮點，只有金色數字 */
.my[data-k="settle"] .dot{background:var(--mute);box-shadow:0 0 0 3px rgba(201,191,159,.14)}
.my[data-k="settle"] .lbl3{color:var(--mute);border-color:rgba(201,191,159,.4);background:rgba(201,191,159,.08)}
.my[data-k="settle"] .act{color:var(--ink);background:rgba(243,234,210,.05);border-color:rgba(214,180,90,.3)}
@media (hover:hover) and (pointer:fine){.my[data-k="settle"]:hover .act{background:rgba(243,234,210,.09);border-color:rgba(214,180,90,.5)}}

/* 輕提示（樣張示意用；opacity 淡入淡出） */
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:max(20px,env(safe-area-inset-bottom));z-index:20;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:999px;font-size:14px;color:var(--ink);background:rgba(16,27,20,.94);border:1px solid rgba(214,180,90,.35);box-shadow:0 8px 24px rgba(16,27,20,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity var(--t) var(--ease)}
.toast.on{opacity:1}

/* 通知 toast（自動離座、先離開某桌）：頂部置中、可換行、有關閉鈕；只用 opacity */
.ntc{position:fixed;z-index:30;left:16px;right:16px;top:max(12px,env(safe-area-inset-top));margin:0 auto;max-width:480px;
  display:grid;grid-template-columns:20px minmax(0,1fr) 44px;align-items:start;gap:10px;padding:12px 4px 12px 14px;border-radius:var(--radius-md);
  color:var(--ink);background:rgba(16,27,20,.96);border:1px solid rgba(214,180,90,.4);
  box-shadow:inset 3px 0 0 var(--gold),0 12px 32px -6px rgba(16,27,20,.75),0 2px 6px rgba(16,27,20,.5);
  opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility 0s linear .28s}
.ntc.on{opacity:1;visibility:visible;transition:opacity var(--t) var(--ease),visibility 0s}
.ntc .ni{width:20px;height:20px;margin-top:1px;color:var(--gold)}
.ntc .nb{min-width:0;padding-top:1px}
.ntc .nt{font-size:14.5px;font-weight:700;line-height:1.45}
.ntc .nd{font-size:13px;color:var(--mute);line-height:1.5;margin-top:2px}
.ntc .nd:empty{display:none}
.ntc .na{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:88px;margin-top:8px;padding:0 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:var(--accent);border:1px solid rgba(230,191,90,.45);background:transparent;transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease)}
.ntc .na[hidden]{display:none}
.ntc .nx{width:44px;height:44px;margin:-10px 0 -10px;display:grid;place-items:center;border-radius:var(--radius-sm);color:var(--mute);transition:color var(--t) var(--ease),background-color var(--t) var(--ease)}
.ntc .nx svg{width:16px;height:16px}
@media (hover:hover) and (pointer:fine){.ntc .nx:hover{color:var(--ink);background:rgba(214,180,90,.08)}.ntc .na:hover{background:rgba(230,191,90,.1);border-color:rgba(230,191,90,.65)}}
.ntc .nx:active,.ntc .na:active{background:rgba(16,27,20,.9);transition-duration:.06s}
.ntc .bar{position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:rgba(214,180,90,.5);opacity:0}

/* E1 空狀態 */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 16px 22px}
.empty svg{width:132px;height:88px;margin-bottom:6px}
.empty h3{font-size:15px;font-weight:700}
.empty p{font-size:13px;line-height:1.5;color:var(--mute)}
.empty .btn-primary{width:auto;min-width:200px;margin-top:10px}

/* ── 主按鈕：開新牌桌 ── */
.btn-primary{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border-radius:var(--radius-md);
  font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--panel);
  background:linear-gradient(180deg,var(--accent) 0%,var(--accent2) 100%);
  box-shadow:inset 0 1px 0 rgba(243,234,210,.45),0 1px 2px rgba(16,27,20,.5),0 8px 20px -8px rgba(201,154,46,.55);
  transition:box-shadow var(--t) var(--ease)}
.btn-primary::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--panel);opacity:0;pointer-events:none;transition:opacity var(--t) var(--ease)}
.btn-primary svg{width:18px;height:18px;flex:none}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{box-shadow:inset 0 1px 0 rgba(243,234,210,.55),0 1px 2px rgba(16,27,20,.5),0 12px 26px -8px rgba(201,154,46,.7)}
}
.btn-primary:active{box-shadow:inset 0 2px 4px rgba(16,27,20,.35),0 0 0 rgba(16,27,20,0);transition-duration:.06s}
.btn-primary:active::after{opacity:.16;transition-duration:.06s}
.btn-primary:focus-visible{outline:2px solid var(--ring);outline-offset:3px}

/* ── 房號輸入（次要入口，安靜版） ── */
.join{padding:12px 14px;border-radius:var(--radius-md);border:1px solid rgba(214,180,90,.16);background:transparent}
.join .jr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.join .jt{min-width:0}
.join label.lbl{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.join .sub{display:block;font-size:12px;color:var(--mute)}
.status{display:flex;align-items:center;gap:8px;height:20px;margin-top:8px;font-size:13px;line-height:20px;color:var(--mute);white-space:nowrap;overflow:hidden}
.status[data-s="error"]{color:var(--warn)}
.status[data-s="success"]{color:var(--accent)}
.status .ico{flex:none;width:14px;height:14px}
.status .msg{overflow:hidden;text-overflow:ellipsis}
.spin{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(214,180,90,.28);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.again{font-size:13px;color:var(--ink);text-decoration:none;padding:0 12px;margin-left:auto;min-height:30px;border:1px solid var(--line-in);border-radius:999px;background:transparent}

/* B：三格（一個真 input 驅動） */
.fb{position:relative;flex:none}
.fb .cells{display:grid;grid-template-columns:repeat(3,44px);gap:8px;pointer-events:none}
.fb .cell{position:relative;height:48px;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--field);border:1px solid var(--line-in);
  font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);
  transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.fb .cell.filled{border-color:var(--line-hi)}
.fb .cell .caret{position:absolute;left:50%;top:50%;width:2px;height:22px;margin:-11px 0 0 -1px;border-radius:1px;background:var(--accent);opacity:0}
.fb.focus .cell.cur{border-color:var(--gold);box-shadow:var(--halo)}
.fb.focus .cell.cur .caret{animation:blink 1.06s steps(1,end) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.fb.focus.all .cell{border-color:var(--gold)}
.fb[data-s="error"].focus.all .cell{border-color:var(--warn);box-shadow:var(--halo-err)}
.fb[data-s="joining"] .cell{color:rgba(243,234,210,.6);border-color:var(--line-hi);box-shadow:none}
.fb[data-s="error"] .cell{border-color:var(--warn)}
.fb[data-s="error"].focus .cell.cur{box-shadow:var(--halo-err)}
.fb[data-s="success"] .cell{border-color:var(--accent);color:var(--accent)}
.fb input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;outline:none;background:transparent;
  font-size:16px;color:transparent;-webkit-text-fill-color:transparent;caret-color:transparent;letter-spacing:0;opacity:.01;cursor:text}
.fb input::selection{background:transparent}
@media (hover:hover) and (pointer:fine){.fb:hover:not(.focus) .cell{border-color:rgba(214,180,90,.5)}}

.hint{font-size:12px;color:var(--mute);margin-top:-6px;padding:0 2px}

/* ── 戰績 ── */
.ranks{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.ranks li{display:flex;justify-content:space-between;gap:12px;font-size:14px}

[hidden]{display:none!important}

/* r5 手機字級（紅線 7）：正文 ≥16、次要 ≥14、標籤 ≥13；頂部列不動 */
@media (max-width:600px){
  .panel-h h2,.sec-h h2,.row b,.my b,.empty h3{font-size:16px}
  .ntc .nt,.ntc .nd,.ntc .na,.empty p,.join label.lbl,.join .sub,.hint,.ranks li,.my .act,.toast{font-size:16px}
  .ntc .nt,.ntc .nd,.empty p,.hint{line-height:1.5}
  .row em,.my em,.seats{font-size:14px}
  .panel-h span,.sec-h span,.tag,.my .lbl3,.row .blinds small,.my .chips-n small{font-size:13px}
  .tag,.my .lbl3{line-height:20px}
  .row{gap:10px;padding:10px 8px}
  .row .l1{gap:5px}
  .tag{padding:0 5px}
  .status{font-size:16px;height:24px;line-height:24px}
  .status .ico{width:16px;height:16px}
  .hint{margin-top:-4px}
}
/* 空狀態時，單欄版的主按鈕就在空狀態按鈕正下方，收起避免兩顆一樣的；雙欄保留 */
@media (max-width:1023px){.is-empty #btnCreate{display:none}}

@media (min-width:1024px){
  .shell{max-width:1080px;padding:28px 32px}
  .amt{width:128px}
  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important;animation-iteration-count:1!important}
  .live-dot{animation:none!important}
  .spin{animation:none!important;border-color:rgba(214,180,90,.28);border-top-color:var(--accent);border-right-color:var(--accent)}
  .fb.focus .cell.cur .caret{animation:none!important;opacity:1}
  .ntc,.ntc.on,.toast{transition:none!important}
}
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <span class="av" aria-hidden="true">謝</span>
    <span class="nm">謝宗良</span>
    <span class="stl" id="stl"><span id="stt">已入座</span></span>
    <span class="amt" id="amtAcc"><small>帳戶</small><b id="bAcc">160</b></span>
    <span class="amt" id="amtTab"><small>牌桌</small><b id="bTab">1,840</b></span>
    <div class="mw">
      <button type="button" class="mbtn" id="mbtn" aria-label="功能清單" aria-haspopup="menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4.5" cy="10" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="15.5" cy="10" r="1.7"/></svg></button>
      <div class="menu" id="menu" role="menu" aria-label="功能清單">
        <button type="button" class="mi pri" role="menuitem" id="miAct" tabindex="-1"></button>
        <div class="sep" id="miSep" role="separator"></div>
        <button type="button" class="mi" role="menuitem" data-go="stats" tabindex="-1"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 14.5v-4M9 14.5v-9M14.5 14.5v-6"/></svg>戰績</button>
        <button type="button" class="mi" role="menuitem" data-go="set" tabindex="-1"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="2.4"/><path d="M9 2.5v2M9 13.5v2M2.5 9h2M13.5 9h2M4.4 4.4l1.4 1.4M12.2 12.2l1.4 1.4M4.4 13.6l1.4-1.4M12.2 5.8l1.4-1.4"/></svg>設定</button>
        <button type="button" class="mi" role="menuitem" data-go="pass" tabindex="-1"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="8" height="13" rx="1.8"/><path d="M8 12.8h2"/></svg>同一支手機輪流玩</button>
        <button type="button" class="mi" role="menuitem" data-go="out" tabindex="-1"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5H4.5v11H7M11 6l3 3-3 3M14 9H7.5"/></svg>登出</button>
      </div>
    </div>
  </header>

  <div class="cols">
    <div class="main">


      <section class="panel mine" id="mine" aria-labelledby="myH">
        <div class="panel-h"><h2 id="myH">我的牌桌</h2><span id="myNote">點一下回到牌桌</span></div>
        <button type="button" class="my" id="myCard" data-k="seat">
          <span class="mt">
            <span class="txt">
              <span class="l1"><span class="dot" aria-hidden="true"></span><b id="myName">週五牌局</b><span class="lbl3" id="myTag">房主</span></span>
              <em id="myMeta">房號 482 · 盲注 10/20 · 4/6 人 · 座位 3</em>
            </span>
            <span class="chips-n"><small id="myChipL">我的籌碼</small><strong id="myChips">1,840</strong></span>
          </span>
          <span class="act" id="myAct"></span>
        </button>
      </section>
      <section class="panel open" aria-labelledby="openH">
        <div class="panel-h"><h2 id="openH">可加入的牌桌</h2><span id="openCount"><i class="live-dot" aria-hidden="true"></i><span id="openN">5</span> 桌 · 即時</span></div>
        <ul class="rows" id="openList"></ul>
        <div class="empty" id="openEmpty" hidden>
          <svg viewBox="0 0 132 88" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="66" cy="80" rx="46" ry="4.5" fill="rgba(16,27,20,.9)"/>
            <ellipse cx="66" cy="46" rx="48" ry="24" stroke="rgba(214,180,90,.55)" stroke-width="1.6" fill="rgba(33,57,44,.55)"/>
            <ellipse cx="66" cy="46" rx="38" ry="17" stroke="rgba(214,180,90,.22)" stroke-width="1.2"/>
            <circle cx="56" cy="44" r="6" stroke="rgba(230,191,90,.75)" stroke-width="1.4"/><circle cx="56" cy="44" r="2.4" stroke="rgba(230,191,90,.45)" stroke-width="1.2"/>
            <rect x="68" y="37" width="12" height="16" rx="2" stroke="rgba(243,234,210,.6)" stroke-width="1.4"/>
            <path d="M108 16v6M105 19h6" stroke="rgba(230,191,90,.7)" stroke-width="1.4"/><circle cx="22" cy="20" r="2.5" stroke="rgba(201,191,159,.6)" stroke-width="1.3"/>
          </svg>
          <h3 id="emH">現在沒有牌桌，開一桌吧</h3>
          <p id="emP">開好之後，家人登入就會在這裡看到。</p>
          <button type="button" class="btn-primary" id="btnCreateE">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11"/></svg>開新牌桌
          </button>
        </div>
      </section>

    </div>
    <div class="main">

      <button type="button" class="btn-primary" id="btnCreate">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11"/></svg>開新牌桌
      </button>

      <!-- B：三格 -->
      <section class="join" id="joinB">
        <div class="jr">
          <div class="jt"><label class="lbl" for="codeB">有房號？</label><span class="sub">輸入 3 位數直接加入</span></div>
          <div class="fb" id="fb" data-s="empty">
            <div class="cells" aria-hidden="true">
              <span class="cell"><span class="digit"></span><span class="caret"></span></span>
              <span class="cell"><span class="digit"></span><span class="caret"></span></span>
              <span class="cell"><span class="digit"></span><span class="caret"></span></span>
            </div>
            <input id="codeB" name="roomcode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3"
              autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
              aria-describedby="stB">
          </div>
        </div>
        <div class="status" id="stB" data-s="empty" aria-live="polite"><span class="msg">打滿 3 位會自動加入，可直接貼上</span></div>
      </section>
      <p class="hint">樣張：輸入 <b>123</b> 會成功，其他號碼約 0.7 秒後顯示「房號不存在」。</p>

      <article class="card" aria-labelledby="stH">
        <h3 id="stH">戰績</h3>
        <ol class="ranks"><li><span>1. 謝宗良</span><b>2,000</b></li><li><span>2. 阿姨</span><b>1,420</b></li></ol>
      </article>

    </div>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <div class="ntc" id="ntc" role="status" aria-live="polite" aria-atomic="true">
    <svg class="ni" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.6"/><path d="M10 9v4.6M10 6.3v.1"/></svg>
    <div class="nb"><p class="nt" id="ntcT"></p><p class="nd" id="ntcD"></p><button type="button" class="na" id="ntcA" hidden></button></div>
    <button type="button" class="nx" id="ntcX" aria-label="關閉通知"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>

</div>

<script>
(() => {
  const LEN = 3, DEMO_OK = '123', DELAY = 700;
  const ICON = {
    err: '<svg class="ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5.6"/><path d="M7 4.2v3.4M7 9.7v.1"/></svg>',
    ok: '<svg class="ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4 5.8 10 11 4.2"/></svg>'
  };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ── 房號輸入（B 三格狀態機） ── */
  function makeJoin({ input, wrap, status, idleMsg, onRender }) {
    let state = 'empty', timer = 0;
    const set = (s, html) => {
      state = s; wrap.dataset.s = s; status.dataset.s = s; status.innerHTML = html;
      input.readOnly = s === 'joining' || s === 'success';
      input.setAttribute('aria-invalid', s === 'error' ? 'true' : 'false');
      wrap.setAttribute('aria-busy', s === 'joining' ? 'true' : 'false');
      const again = status.querySelector('.again');
      if (again) again.addEventListener('click', reset);
      onRender && onRender();
    };
    const idle = () => {
      const n = input.value.length;
      if (!n) set('empty', `<span class="msg">${idleMsg}</span>`);
      else set('typing', `<span class="msg">還差 ${LEN - n} 位</span>`);
    };
    const join = () => {
      const code = input.value;
      set('joining', '<span class="spin" aria-hidden="true"></span><span class="msg">加入中…</span>');
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (code === DEMO_OK) set('success', `${ICON.ok}<span class="msg">已加入「週五牌局」</span><button type="button" class="again">再試一次</button>`);
        else {
          set('error', `${ICON.err}<span class="msg">房號 ${code} 不存在，請再確認</span>`);
          if (document.activeElement === input) { input.select(); onRender && onRender(); }
        }
      }, DELAY);
    };
    const sanitize = (raw) => (raw || '').replace(/\D/g, '').slice(0, LEN);
    input.addEventListener('input', () => {
      if (state === 'joining' || state === 'success') return;
      const v = sanitize(input.value);
      if (v !== input.value) input.value = v;
      if (v.length === LEN) join(); else idle();
    });
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      if (state === 'joining' || state === 'success') return;
      const t = (e.clipboardData && e.clipboardData.getData('text')) || '';
      const m = t.match(/room=(\d{3})(?!\d)/i) || t.match(/(?:^|\D)(\d{3})(?:\D|$)/);
      if (m) input.value = m[1];
      else {
        const a = input.selectionStart ?? input.value.length, b = input.selectionEnd ?? a;
        input.value = sanitize(input.value.slice(0, a) + t + input.value.slice(b));
      }
      input.dispatchEvent(new Event('input', { bubbles: true }));
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && state === 'error' && input.value.length === LEN) { e.preventDefault(); join(); }
    });
    function reset() { clearTimeout(timer); input.readOnly = false; input.value = ''; idle(); }
    idle();
    return { reset, get state() { return state; } };
  }

  const fb = document.getElementById('fb'), inB = document.getElementById('codeB');
  const cells = [...fb.querySelectorAll('.cell')];
  const renderB = () => {
    const v = inB.value, err = fb.dataset.s === 'error';
    const all = err && v.length === LEN && inB.selectionStart === 0 && inB.selectionEnd === LEN;
    fb.classList.toggle('all', all);
    cells.forEach((c, i) => {
      c.querySelector('.digit').textContent = v[i] || '';
      c.classList.toggle('filled', !!v[i]);
      c.classList.toggle('cur', !all && v.length < LEN && i === v.length);
    });
  };
  const B = makeJoin({ input: inB, wrap: fb, status: document.getElementById('stB'),
    idleMsg: '打滿 3 位會自動加入，可直接貼上', onRender: renderB });
  const toEnd = () => { if (fb.dataset.s !== 'error') { const n = inB.value.length; inB.setSelectionRange(n, n); } renderB(); };
  inB.addEventListener('focus', () => { fb.classList.add('focus'); requestAnimationFrame(toEnd); });
  inB.addEventListener('blur', () => fb.classList.remove('focus'));
  inB.addEventListener('click', toEnd);
  inB.addEventListener('keyup', renderB);
  document.addEventListener('selectionchange', () => { if (document.activeElement === inB) renderB(); });
  renderB();

  /* ── 可加入的牌桌（假資料＋即時人數） ── */
  const tables = [
    { id: 't1', name: '週六家族盃', host: '阿姨', code: '317', bb: '10/20', seated: 3 },
    { id: 't2', name: '高手過招', host: '小舅', code: '905', bb: '50/100', seated: 6 },
    { id: 't3', name: '練習桌（新手歡迎）', host: '表哥', code: '264', bb: '5/10', seated: 2 },
    { id: 't4', name: '下班小玩', host: '阿明', code: '738', bb: '10/20', seated: 5 },
    { id: 't5', name: '深夜場', host: '小美', code: '051', bb: '25/50', seated: 4 }
  ];
  const list = document.getElementById('openList');
  const pips = (n) => Array.from({ length: 6 }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
  const label = (t) => `${t.name}，房主 ${t.host}，盲注 ${t.bb}，${t.seated} / 6 人，房號 ${t.code}${t.seated >= 6 ? '，已滿，可觀戰' : ''}`;
  list.innerHTML = tables.map((t) => `
    <li><button type="button" class="row${t.seated >= 6 ? ' full' : ''}" data-id="${t.id}" aria-label="${esc(label(t))}">
      <span class="hav" aria-hidden="true">${esc(t.host[0])}</span>
      <span class="txt" aria-hidden="true">
        <span class="l1"><b>${esc(t.name)}</b><span class="tag">已滿，可觀戰</span></span>
        <em>${esc(t.host)} 開桌 · 房號 ${esc(t.code)}</em>
      </span>
      <span class="side" aria-hidden="true">
        <span class="blinds"><small>盲注</small>${esc(t.bb)}</span>
        <span class="seats"><span class="pips">${pips(t.seated)}</span><span class="n">${t.seated}/6</span></span>
      </span>
    </button></li>`).join('');

  function setSeated(t, n) {
    t.seated = n;
    const row = list.querySelector(`[data-id="${t.id}"]`);
    row.querySelectorAll('.pips i').forEach((p, i) => p.classList.toggle('on', i < n));
    const num = row.querySelector('.n');
    num.classList.add('swap');
    setTimeout(() => { num.textContent = `${n}/6`; num.classList.remove('swap'); }, 110);
    row.classList.toggle('full', n >= 6);
    row.setAttribute('aria-label', label(t));
  }
  let tick = setInterval(() => {
    const t = tables[Math.floor(Math.random() * tables.length)];
    let d = Math.random() < 0.5 ? -1 : 1;
    if (t.seated + d > 6 || t.seated + d < 1) d = -d;
    setSeated(t, t.seated + d);
  }, 2600);

  function setEmpty(on) {
    list.hidden = on;
    document.getElementById('openEmpty').hidden = !on;
    document.getElementById('openN').textContent = on ? 0 : tables.length;
    document.body.classList.toggle('is-empty', on);
    syncEmpty();
  }
  /* 空狀態的下一步：能開桌就給「開新牌桌」；房主（已有自己的桌）改說明，下一步是上面的我的牌桌卡 */
  function syncEmpty() {
    const can = !document.getElementById('btnCreate').hidden;
    document.getElementById('btnCreateE').hidden = !can;
    document.getElementById('emH').textContent = can ? '現在沒有牌桌，開一桌吧' : '現在沒有其他牌桌';
    document.getElementById('emP').textContent = can ? '開好之後，家人登入就會在這裡看到。' : '家人開桌後會出現在這裡；回你的牌桌請點上面的卡片。';
  }

  /* ── 點列：回座／進桌觀戰 ── */
  const toast = document.getElementById('toast'); let tt = 0;
  const flash = (_, msg) => { toast.textContent = msg; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 2200); };
  list.addEventListener('click', (e) => {
    const row = e.target.closest('.row'); if (!row) return;
    const t = tables.find((x) => x.id === row.dataset.id);
    flash(null, t.seated >= 6 ? `（樣張）進入「${t.name}」觀戰` : `（樣張）進入「${t.name}」，點空位入座`);
  });

  /* ── 通知 toast：一般 5 秒自動消失（滑過或聚焦時暫停）；sticky（已自動離座）不自動關，要按「知道了」或 ✕ ── */
  const ntc = document.getElementById('ntc'), nT = document.getElementById('ntcT'), nD = document.getElementById('ntcD'), nA = document.getElementById('ntcA');
  let nTimer = 0, nAct = null, nSticky = false;
  const NTC_MS = 5000;
  const hideNtc = () => { clearTimeout(nTimer); ntc.classList.remove('on'); };
  const armNtc = () => { clearTimeout(nTimer); if (!nSticky) nTimer = setTimeout(hideNtc, NTC_MS); };
  function notify(title, desc = '', action = null, opt = {}) {
    nT.textContent = title; nD.textContent = desc;
    nAct = action; nA.hidden = !action; if (action) nA.textContent = action.label;
    nSticky = !!opt.sticky || !!action; ntc.dataset.sticky = nSticky ? '1' : '';
    ntc.classList.add('on'); armNtc();
  }
  document.getElementById('ntcX').addEventListener('click', hideNtc);
  nA.addEventListener('click', () => { hideNtc(); nAct && nAct.run && nAct.run(); });
  ntc.addEventListener('pointerenter', () => clearTimeout(nTimer));
  ntc.addEventListener('pointerleave', () => { if (ntc.classList.contains('on')) armNtc(); });
  ntc.addEventListener('focusin', () => clearTimeout(nTimer));
  ntc.addEventListener('focusout', (e) => { if (!ntc.contains(e.relatedTarget) && ntc.classList.contains('on')) armNtc(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ntc.classList.contains('on')) hideNtc(); });

  /* ── 頂部狀態（名字下面）＋金額框＋功能清單 ── */
  const ARROW = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 12 9l-5 5"/></svg>';
  const CASH = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M9 6v6M6.5 9.2 9 12l2.5-2.8"/></svg>';
  const fmt = (n) => n.toLocaleString('en-US');
  const MY = {
    host:   { k: 'seat',   word: '我是房主',   name: '週五牌局',   chips: 1840, btn: false, tag: '房主',   meta: '房號 482 · 盲注 10/20 · 4/6 人 · 座位 3', chipL: '我的籌碼', note: '點一下回到牌桌' },
    guest:  { k: 'seat',   word: '已入座',   name: '週六家族盃', chips: 1840, btn: true,  tag: '入座中', meta: '房主 阿姨 · 房號 317 · 盲注 10/20 · 3/6 人', chipL: '我的籌碼', note: '點一下回到牌桌' },
    settle: { k: 'settle', word: '待結帳', name: '週五牌局',   chips: 1840, btn: true,  tag: '已收桌', meta: '沒人在線 30 分鐘，已自動收桌', chipL: '可帶回', note: '結帳後籌碼回到帳戶' },
    none:   { k: 'none', word: '在大廳', btn: true },
    away:   { k: 'none', word: '已自動離座', btn: true }
  };
  const TOTAL = 2000;
  const stl = document.getElementById('stl'), stt = document.getElementById('stt'), btn = document.getElementById('btnCreate');
  const mine = document.getElementById('mine'), my = document.getElementById('myCard');
  const bAcc = document.getElementById('bAcc'), bTab = document.getElementById('bTab');
  const miAct = document.getElementById('miAct'), miSep = document.getElementById('miSep');
  let cur = 'host', busyT = 0, attnT = 0;
  function setAmt(el, n, animate) {
    const apply = () => { el.textContent = n ? fmt(n) : '—'; el.classList.toggle('zero', !n); };
    if (!animate) return apply();
    el.classList.add('swap'); setTimeout(() => { apply(); el.classList.remove('swap'); }, 110);
  }
  function render(k, animate) {
    cur = k; const d = MY[k];
    clearTimeout(busyT); stl.removeAttribute('aria-busy');
    my.removeAttribute('aria-busy'); mine.classList.remove('attn'); mine.hidden = d.k === 'none';
    toast.classList.remove('on'); closeMenu(false);
    btn.hidden = !d.btn; syncEmpty();
    const tab = d.k === 'none' ? 0 : d.chips;
    setAmt(bAcc, TOTAL - tab, animate); setAmt(bTab, tab, animate);
    document.getElementById('amtAcc').setAttribute('aria-label', `帳戶 ${fmt(TOTAL - tab)}`);
    document.getElementById('amtTab').setAttribute('aria-label', `牌桌 ${tab ? fmt(tab) : 0}`);
    if (d.k === 'none') {
      stt.textContent = d.word;
      miAct.hidden = true; miSep.hidden = true; return;
    }
    stt.textContent = d.word;
    my.dataset.k = d.k;
    document.getElementById('myName').textContent = d.name;
    document.getElementById('myTag').textContent = d.tag;
    document.getElementById('myMeta').textContent = d.meta;
    document.getElementById('myChipL').textContent = d.chipL;
    document.getElementById('myChips').textContent = fmt(d.chips);
    document.getElementById('myNote').textContent = d.note;
    setCardAct(d, false);
    miAct.hidden = false; miSep.hidden = false;
    miAct.classList.toggle('settle', d.k === 'settle');
    if (d.k === 'settle') {
      miAct.innerHTML = `${CASH}<span>結帳離開（帶回 <span class="num">${fmt(d.chips)}</span>）</span>`;
    } else {
      miAct.innerHTML = `${ARROW}<span>回到牌桌</span>`;
    }
  }
  function setCardAct(d, busy) {
    const act = document.getElementById('myAct');
    if (d.k === 'settle') {
      act.innerHTML = busy ? '結帳中…' : `<span>結帳離開（帶回 <span class="num">${fmt(d.chips)}</span>）</span>`;
      my.setAttribute('aria-label', `${d.name}，已自動收桌。結帳離開，帶回 ${fmt(d.chips)} 籌碼`);
    } else {
      act.innerHTML = busy ? '回座中…' : `回到牌桌<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>`;
      my.setAttribute('aria-label', `回到牌桌：${d.name}，${d.tag}，${d.meta.replace(/ · /g, '，')}，我的籌碼 ${fmt(d.chips)}`);
    }
  }
  function doAction() {
    const d = MY[cur]; if (d.k === 'none' || stl.getAttribute('aria-busy') === 'true') return;
    stl.setAttribute('aria-busy', 'true'); mine.classList.remove('attn');
    my.setAttribute('aria-busy', 'true'); setCardAct(d, true);
    stt.textContent = d.k === 'settle' ? '結帳中…' : '回座中…';
    busyT = setTimeout(() => {
      stl.removeAttribute('aria-busy'); my.removeAttribute('aria-busy');
      if (d.k === 'settle') { render('none', true); flash(null, `（樣張）已結帳，${fmt(d.chips)} 回到帳戶`); }
      else { stt.textContent = d.word; setCardAct(d, false); flash(null, `（樣張）已回到「${d.name}」`); }
    }, DELAY);
  }
  my.addEventListener('click', doAction);

  /* 功能清單：opacity 開關；Esc、點外面、選了項目都會關 */
  const mbtn = document.getElementById('mbtn'), menu = document.getElementById('menu');
  const items = () => [...menu.querySelectorAll('.mi')].filter((x) => !x.hidden);
  function openMenu() { menu.classList.add('on'); mbtn.setAttribute('aria-expanded', 'true'); requestAnimationFrame(() => items()[0].focus()); }
  function closeMenu(refocus) {
    if (!menu.classList.contains('on')) return;
    menu.classList.remove('on'); mbtn.setAttribute('aria-expanded', 'false'); if (refocus) mbtn.focus();
  }
  mbtn.addEventListener('click', () => (menu.classList.contains('on') ? closeMenu(false) : openMenu()));
  document.addEventListener('pointerdown', (e) => { if (menu.classList.contains('on') && !e.target.closest('.mw')) closeMenu(false); });
  menu.addEventListener('keydown', (e) => {
    const list = items(), i = list.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); list[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); list[list.length - 1].focus(); }
    else if (e.key === 'Tab') closeMenu(false);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && menu.classList.contains('on')) { e.stopPropagation(); closeMenu(true); } }, true);
  miAct.addEventListener('click', () => { closeMenu(true); doAction(); });
  menu.querySelectorAll('[data-go]').forEach((el) => el.addEventListener('click', () => {
    closeMenu(true);
    if (el.dataset.go === 'stats') { const c = document.getElementById('stH').closest('.card'); c.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
    else flash(null, `（樣張）${el.textContent.trim()}`);
  }));

  document.getElementById('btnCreateE').addEventListener('click', () => btn.click());
  btn.addEventListener('click', () => {
    if (cur === 'guest') {
      const d = MY.guest;
      notify(`先離開「${d.name}」`, '你正坐在這桌，離座結帳後才能開新牌桌。', { label: '回到這一桌', run: doAction });
      clearTimeout(attnT); mine.classList.add('attn');
      attnT = setTimeout(() => mine.classList.remove('attn'), 1600);
      return;
    }
    flash(null, '（樣張）開新牌桌 → 進入開房頁');
  });
  /* 只供測試的隱藏網址參數：?state=none|host|guest|settle|away、?empty=1；頁面上沒有任何控制 */
  const qs = new URLSearchParams(location.search);
  const k0 = MY[qs.get('state')] ? qs.get('state') : 'guest';
  render(k0);
  if (k0 === 'away') notify('你暫離超過 30 分鐘，已自動離座，籌碼已回帳戶', '', { label: '知道了' }, { sticky: true });
  if (qs.get('empty') === '1') setEmpty(true);

  window.__demo = { setEmpty, B, tables, setSeated, render, notify, hideNtc, NTC_MS, openMenu, closeMenu, stop: () => clearInterval(tick) };
})();
</script>
</body>
</html>
