*{box-sizing:border-box}[hidden]{display:none!important}html{font-size:100%;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif}button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,[tabindex="-1"]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{cursor:default}h1,h2,h3,p{margin:0}h1{font-size:1.75rem;line-height:1.5;font-weight:700;letter-spacing:.02em}h2{font-size:1.25rem;line-height:1.7}h3{font-size:1.0625rem}u{text-underline-offset:5px;text-decoration-thickness:1.5px}main{max-width:752px;margin:auto;padding:16px 16px calc(112px + env(safe-area-inset-bottom))}.card{display:block;width:100%;border-radius:var(--r);background:var(--paper);color:inherit}.c1{padding:16px;border:1px solid var(--line);transition:transform .22s var(--ease),border-color .22s var(--ease)}.intro{padding-top:28px}.intro h1{margin-bottom:16px}.description{color:var(--muted)}fieldset{border:0;padding:0;margin:28px 0 0;min-width:0}legend{padding:0;margin-bottom:12px;font-weight:500}.hint{font-weight:400;color:var(--muted);font-size:.875rem}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{flex:0 0 calc((100% - 8px)/2);min-height:44px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 3px;font-size:1rem;line-height:1.5;cursor:pointer;transition:transform .12s var(--ease),background-color .18s var(--ease),border-color .18s var(--ease)}.chip[aria-pressed=true]{background:var(--chip);border-color:var(--chip-border);color:var(--chip-text);font-weight:600}.count{margin-top:18px;color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;padding:10px 24px;font-weight:600;cursor:pointer;transition:transform .12s var(--ease),background-color .18s var(--ease),color .18s var(--ease),border-c und-color .18s var(--ease),border-color .18s var(--ease)}.bubble{flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:.875rem;line-height:1}.option-text{flex:1;min-width:0}.marks{font-size:.8125rem;font-weight:600;flex:none;white-space:nowrap;margin-left:8px}.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:#174673}.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:#803d32}.opt:disabled{opacity:1}.explanation{margin-top:16px;padding:18px 16px;border-radius:var(--r);background:#e5effa;transition:opacity .18s var(--ease)}.explanation.pending{visibility:hidden;opacity:0}.explanation strong{font-weight:600}.keys{display:none;color:var(--muted);font-size:.8125rem;margin:18px 0 0}.score{font-size:4rem;line-height:1.4;font-weight:600;font-variant-numeric:tabular-nums}.score small{font-size:1.5rem;font-weight:400;color:var(--muted)}.summary{padding:12px 0 24px}.summary p{margin-top:12px}.review{margin-top:32px}.review>h2{margin-bottom:16px}.review article+article{margin-top:16px}.review article.c1{border-color:var(--review-line)}.review h3{margin-bottom:14px}.review p+p{margin-top:8px}.review .excerpt{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--soft-line);color:var(--ink)}.emp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:32px 0}.emp .art{width:132px;height:96px}.emp p{max-width:24em}.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

<body>
<header class="top" id="top" hidden><div class="top-inner"><p class="progress" id="progress" aria-live="polite"></p><div class="dots" id="dots" aria-hidden="true"></div></div></header>
<main id="main" class="home-main"></main>
<script>
'use strict';
const TYPES=['字彙','文法句型','克漏字題組','閱讀題組'];
const GROUP_TYPES=TYPES.slice(2);
const LETTERS='ABCD';
const main=document.getElementById('main');
let bank=[],selected=new Set(TYPES),prepared=[],round=[],responses=[],index=0,mode='home',redo=false,loaded=false,failed=false;let ctx;
function armAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!ctx)ctx=new C();if(ctx.state==='suspended')ctx.resume();}catch{}}
document.addEventListener('pointerdown',armAudio,true);
document.addEventListener('keydown',armAudio,true);
const SFX={ok:{peak:.22,len:.32,voices:[{f:587.33,s:0,d:.26,g:.15,a:.012,r:.2,sine:.85,tri:.15},{f:739.99,s:.09,d:.24,g:.14,a:.012,r:.18,sine:.85,tri:.15}]},score:{peak:.22,len:.62,voices:[{f:349.23,s:0,d:.46,g:.12,a:.016,r:.28,sine:1,tri:.08},{f:440,s:.12,d:.44,g:.12,a:.016,r:.28,sine:1,tri:.08},{f:523.25,s:.24,d:.42,g:.11,a:.016,r:.26,sine:1,tri:.08}]},bad:{peak:.11,len:.2,voices:[{f:392,s:0,d:.2,g:.1,a:.005,r:.15,sine:.92,tri:.08}]}};
function sfxEnv(n,sr,attack,release){let a=Math.max(1,Math.round(attack*sr)),r=Math.max(1,Math.round(release*sr));if(a+r>n){const s=n/(a+r);a=Math.max(1,Math.round(a*s));r=Math.max(1,n-a);}const env=new Float64Array(n).fill(1);for(let i=0;i<a;i++)env[i]=i/a;for(let i=0;i<r;i++){const x=r===1?1:1-i/(r-1);env[n-r+i]=x*x;}return env;}
function renderSfx(spec,ac){const sr=ac.sampleRate,n=Math.round(spec.len*sr),buf=new Float64Array(n);for(const v of spec.voices){const i0=Math.round(v.s*sr);let ln=Math.round(v.d*sr);if(i0>=n||ln<=0)continue;ln=Math.min(ln,n-i0);const env=sfxEnv(ln,sr,v.a,v.r),parts=(v.p||[]).map(p=>({ratio:p[0],amp:p[1],pe:sfxEnv(ln,sr,v.a,Math.min(v.d,v.r*p[2]))}));for(let i=0;i<ln;i++){const t=i/sr;let w=v.sine*Math.sin(2*Math.PI*v.f*t);if(v.tri)w+=v.tri*(2*Math.abs(2*((v.f*t)%1)-1)-1);for(const p of parts)w+=p.amp*Math.sin(2*Math.PI*v.f*p.ratio*t)*p.pe[i];buf[i0+i]+=v.g*env[i]*w;}}let peak=0,mean=0;for(let i=0;i<n;i++){const a=Math.abs(buf[i]);if(a>peak)peak=a;mean+=buf[i];}mean/=n;const out=ac.createBuffer(1,n,sr),ch=out.getChannelData(0);if(peak>0){const k=spec.peak/peak;for(let i=0;i<n;i++)ch[i]=(buf[i]-mean)*k;}return out;}
function playSfx(kind){try{armAudio();if(!ctx)return;const spec=SFX[kind];if(!spec)return;const src=ctx.createBufferSource();src.buffer=renderSfx(spec,ctx);src.connect(ctx.destination);src.start();}catch{}}
const shuffle=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
// Question content is text; only explicitly allowed source tags survive.
function rich(value){
 const source=new DOMParser().parseFromString(String(value),'text/html'),out=document.createElement('span');
 function text(value,parent){
  const pattern=/([A-Za-z]+(?:-[A-Za-z]+)*)(（[^（）]*[\u3400-\u9fff][^（）]*）)|__\((\d+)\)__|_{2,}|\n/g;
  let end=0;
  for(const m of value.matchAll(pattern)){
   parent.append(document.createTextNode(value.slice(end,m.index)));
   if(m[1]){parent.append(document.createTextNode(m[1]));const el=document.createElement('span');el.className='gloss';el.textContent=m[2];parent.append(el);}
   else if(m[3]){const el=document.createElement('span');el.className='blank';el.dataset.blank=m[3];el.textContent=`（${m[3]}）`;parent.append(el);}
   else if(m[0]==='\n')parent.append(document.createElement('br'));
   else{const el=document.createElement('span');el.className='gap';el.setAttribute('aria-label','空格');parent.append(el);}
   end=m.index+m[0].length;
  }
  parent.append(document.createTextNode(value.slice(end)));
 }
 function copy(node,parent){
  if(node.nodeType===3){text(node.textContent,parent);return;}
  if(node.nodeType!==1||['SCRIPT','STYLE','IFRAME','OBJECT','TEMPLATE'].includes(node.tagName))return;
  const allowed=['U','BR','SPAN','TABLE','THEAD','TBODY','TR','TH','TD'];
  const target=allowed.includes(node.tagName)?document.createElement(node.tagName.toLowerCase()):parent;
  if(target!==parent)parent.append(target);
  for(const child of node.childNodes)copy(child,target);
 }
 for(const node of source.body.childNodes)copy(node,out);
 return out.innerHTML;
}
function passageHTML(value){
 const out=document.createElement('div');out.className='passage-body';
 const lines=String(value).replace(/\r\n?/g,'\n').split('\n');let paragraph=[];
 const flush=()=>{if(!paragraph.length)return;const p=document.createElement('p');p.innerHTML=rich(paragraph.join('\n'));out.append(p);paragraph=[];};
 for(let i=0;i<lines.length;){
  if(!lines[i].trim()){flush();i++;continue;}
  if(!lines[i].includes('|')){paragraph.push(lines[i++]);continue;}
  flush();const block=[];while(i<lines.length&&lines[i].includes('|'))block.push(lines[i++]);
  const rows=block.map(line=>line.split('|').map(cell=>cell.trim()));
  if(rows.length<2||rows[0].length<2||rows.some(row=>row.length!==rows[0].length||row.some(cell=>!cell))){const fallback=document.createElement('p');fallback.className='schedule-fallback';fallback.textContent=block.join('\n');out.append(fallback);continue;}
  const wrap=document.createElement('div');wrap.className='schedule-wrap';const table=document.createElement('table');table.className='schedule';
  const head=document.createElement('thead'),body=document.createElement('tbody');
  rows.forEach((row,n)=>{const tr=document.createElement('tr');row.forEach(cell=>{const el=document.createElement(n?'td':'th');if(!n)el.scope='col';el.innerHTML=rich(cell);tr.append(el);});(n?body:head).append(tr);});
  table.append(head,body);wrap.append(table);out.append(wrap);
 }
 flush();return out.outerHTML;
}
function blankNumber(q){return q.stem.match(/blank\s*\((\d+)\)/i)?.[1];}
function updateBlanks(container,q){
 if(q.type!=='克漏字題組')return;
 container.querySelectorAll('[data-blank]').forEach(el=>{
  const n=el.dataset.blank,at=round.findIndex(item=>item.group===q.group&&blankNumber(item)===n);
  const filled=at>=0&&responses[at]!==undefined;
  el.classList.toggle('current',n===blankNumber(q)&&!filled);el.classList.toggle('filled',filled);
  el.innerHTML=filled?rich(round[at].options[round[at].answer]):`（${n}）`;
 });
}
function passageTitle(q){return `${q.type==='克漏字題組'?'克漏字':'閱讀'}篇章 · ${rich(q.lesson)}`;}
function drawRound(){
 const byGroup=new Map();for(const q of bank)if(q.group){if(!byGroup.has(q.group))byGroup.set(q.group,[]);byGroup.get(q.group).push(q);}
 const types=GROUP_TYPES.filter(t=>selected.has(t)),singles=TYPES.slice(0,2).filter(t=>selected.has(t));
 const pools=new Map(types.map(t=>[t,shuffle([...byGroup.values()].filter(g=>g[0].type===t))]));
 const blocks=[];let total=0;
 const take=t=>{const g=pools.get(t).shift();if(g){blocks.push(g);total+=g.length;}return !!g;};
 if(types.length===1&&!singles.length){while(total<10&&take(types[0])){}}
 else{
  for(const t of types)take(t);
  if(types.length===2&&!singles.length){while(total<10){const t=types.filter(t=>pools.get(t).length).sort((a,b)=>pools.get(a)[0].length-pools.get(b)[0].length)[0];if(!t||!take(t))break;}}
  const available=shuffle(bank.filter(q=>singles.includes(q.type)));
  for(const t of shuffle(singles)){const at=available.findIndex(q=>q.type===t);if(at>=0&&total<10){blocks.push(available.splice(at,1));total++;}}
  while(total<10&&available.length){blocks.push([available.shift()]);total++;}
 }
 return shuffle(blocks).flat();
}
function action(label,id,secondary=false){return `<button class="btn ${secondary?'b2':'b4'}" id="${id}">${label}</button>`;}
function focusHeading(){main.querySelector('h1,h2')?.focus({preventScroll:true});}
function home(){mode='home';round=[];responses=[];document.getElementById('top').hidden=true;main.className='home-main';main.innerHTML=`<section class="card c1 intro"><h1 tabindex="-1">國中會考英文複習測驗</h1><p class="description">會考題型題庫 100 題，每回抽 10 題，答完即看解說、不留成績。</p><fieldset><legend>要練的題型<span class="hint">（點一下可排除該題型）</span></legend><div class="chips">${TYPES.map(t=>`<button class="chip" aria-pressed="${selected.has(t)}" data-type="${t}">${t}</button>`).join('')}</div></fieldset><p class="count" id="count" aria-live="polite">${loaded?`本回 ${prepared.length} 題`:''}</p></section><div class="actions">${action(`${!loaded?'<span class="spin" aria-hidden="true"></span>':''}開始作答`,'start')}</div><p class="keys">Enter 開始作答</p>`;document.getElementById('start').disabled=!loaded;document.getElementById('start').setAttribute('aria-busy',String(!loaded));document.getElementById('start').onclick=()=>start(prepared,false);main.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const t=b.dataset.type;if(selected.has(t)){if(selected.size===1)return;selected.delete(t);}else selected.add(t);b.setAttribute('aria-pressed',String(selected.has(t)));if(loaded){prepared=drawRound();document.getElementById('count').textContent=`本回 ${prepared.length} 題`;document.getElementById('start').disabled=!prepared.length;}});window.scrollTo(0,0);}
function error(){mode='error';failed=true;document.getElementById('top').hidden=true;main.className='home-main';main.innerHTML=`<section class="card c1 emp"><svg class="art" viewBox="0 0 132 96" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="66" cy="84" rx="44" ry="5" fill="var(--soft-line)"/><path d="M52 22h28M55 22v8c0 3-9 7-9 22a20 20 0 0 0 40 0c0-15-9-19-9-22v-8" stroke="var(--line)" stroke-width="1.6" fill="var(--paper)"/><path d="M47 54c8 4 30 4 38 0M24 70c6-10 14-14 22-12M110 66c-4-8-10-11-17-10" stroke="var(--accent)" stroke-width="1.4"/></svg><p role="alert">題目現在載不進來，請重新整理再試一次。</p>${action('重新整理','reload')}</section>`;document.getElementById('reload').onclick=()=>location.reload();}
function progress(){document.getElementById('top').hidden=false;document.getElementById('progress').textContent=mode==='result'?'本回結束':`${redo?'錯題再練 · ':''}第 ${index+1} 題，共 ${round.length} 題`;document.getElementById('dots').innerHTML=round.map((q,n)=>`<span class="dot ${responses[n]===undefined?'':responses[n]===q.answer?'y':'n'} ${mode==='quiz'&&n===index?'now':''}">${responses[n]===undefined?'':responses[n]===q.answer?'✓':'×'}</span>`).join('');}
function start(list,isRedo){if(!loaded||!list.length)return;round=[...list];responses=[];index=0;redo=isRedo;mode='quiz';main.innerHTML='<div class="layout"><aside id="passage" class="card c1 passage" hidden></aside><section class="question-column" id="question"></section></div>';show();}
function feedback(q,pick){return `${pick===q.answer?'答對。':`答錯，正確答案是 ${LETTERS[q.answer]}。`} ${q.explain}`;}
function show(){mode='quiz';const q=round[index];progress();const passage=document.getElementById('passage');const sameGroup=!!q.group&&passage.dataset.group===q.group;main.className=q.group?'reading-main':'';passage.hidden=!q.group;if(q.group&&!sameGroup){passage.innerHTML=`<h2>${passageTitle(q)}</h2>${passageHTML(q.passage)}`;passage.dataset.group=q.group;passage.scrollTop=0;}else if(!q.group){delete passage.dataset.group;}
updateBlanks(passage,q);
const column=document.getElementById('question');column.innerHTML=`<div class="card c1 question-card"><div class="tags"><span class="tag l2"><i aria-hidden="true"></i>${q.type}</span>${q.sample?'<span class="tag l2">範例</span>':''}</div><h2 tabindex="-1">${rich(q.stem)}</h2></div><div class="options" role="group" aria-label="答案選項">${q.options.map((o,n)=>`<button class="opt" data-choice="${n}"><span class="bubble">${LETTERS[n]}</span><span class="option-text">${rich(o)}</span><span class="marks"></span></button>`).join('')}</div><div class="actions" id="next-action"></div><div id="explanation" class="explanation pending" aria-hidden="true">${rich(feedback(q,(q.answer+1)%4))}</div><p class="keys">方向鍵選答案，Enter／空白鍵確認；1–4 直接作答</p>`;column.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(Number(b.dataset.choice)));column.scrollTop=0;if(!sameGroup)window.scrollTo(0,0);focusHeading();}
function pick(choice){if(mode!=='quiz'||responses[index]!==undefined)return;const q=round[index];responses[index]=choice;if(choice===q.answer)playSfx('ok');else playSfx('bad');updateBlanks(document.getElementById('passage'),q);document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n===q.answer){b.classList.add('correct');b.querySelector('.marks').textContent=choice===n?'正確 · 你的選擇':'正確';}else if(n===choice){b.classList.add('wrong');b.querySelector('.marks').textContent='你的選擇';}});const note=document.getElementById('explanation');note.innerHTML=rich(feedback(q,choice));note.classList.remove('pending');note.removeAttribute('aria-hidden');note.setAttribute('role','status');document.getElementById('next-action').innerHTML=action(index===round.length-1?'看成績':'下一題','next');document.getElementById('next').onclick=next;progress();document.getElementById('next').focus({preventScroll:true});}
function next(){if(mode!=='quiz'||responses[index]===undefined)return;if(index+1<round.length){index++;show();}else result();}
function result(){mode='result';progress();const wrong=round.filter((q,n)=>responses[n]!==q.answer);const score=round.length-wrong.length;const percentage=Math.round(score/round.length*100);const ratio=score/round.length;const comment=ratio===1?'全部答對。':ratio>=.8?'觀念很清楚，錯的幾題看一下解說就好。':ratio>=.6?'及格了，把錯題再練一次會更穩。':'先看下面的解說，再練一次錯題。';main.className='';main.innerHTML=`<section class="summary"><h1 class="score" tabindex="-1" aria-label="答對 ${score} 題，共 ${round.length} 題">${score} <small>／ ${round.length}</small></h1><p>正確率 ${percentage}%。${comment}</p></section><div class="actions result-actions">${wrong.length?action(`再練錯的 ${wrong.length} 題`,'redo'):''}${action('從頭再做一次','restart',true)}</div>${wrong.length?`<section class="review"><h2>答錯的題目</h2>${round.map((q,n)=>responses[n]===q.answer?'':`<article class="card c1">${q.group?`<div class="excerpt">${passageTitle(q)}${passageHTML(q.passage)}</div>`:''}<h3>${rich(q.stem)}</h3><p>你選：${LETTERS[responses[n]]} · ${rich(q.options[responses[n]])}</p><p>正確：${LETTERS[q.answer]} · ${rich(q.options[q.answer])}</p><p>${rich(q.explain)}</p></article>`).join('')}</section>`:''}`;if(wrong.length)document.getElementById('redo').onclick=()=>start(wrong,true);document.getElementById('restart').onclick=()=>{prepared=drawRound();home();focusHeading();};window.scrollTo(0,0);focusHeading();playSfx('score');}
document.addEventListener('keydown',event=>{if(event.repeat||event.altKey||event.ctrlKey||event.metaKey||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;const key=event.key;if(mode==='home'&&key==='Enter'){if(event.target.closest('.chip'))return;event.preventDefault();if(loaded&&!failed)start(prepared,false);return;}if(mode!=='quiz')return;const answered=responses[index]!==undefined;if(/^[1-4]$/.test(key)&&!answered){event.preventDefault();pick(Number(key)-1);return;}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)&&!answered){event.preventDefault();const buttons=[...document.querySelectorAll('.opt')];const current=buttons.indexOf(document.activeElement);const direction=['ArrowUp','ArrowLeft'].includes(key)?-1:1;buttons[current<0?0:(current+direction+4)%4].focus();return;}if(key==='Enter'||key===' '){event.preventDefault();if(answered)next();else pick(Number(document.activeElement.dataset.choice??0));}});
function validate(data){
 if(!Array.isArray(data)||!data.length)throw Error('empty');
 const ids=new Set(),groups=new Map();
 for(const q of data){
  if(!q||typeof q.id!=='string'||!q.id||ids.has(q.id)||!TYPES.includes(q.type)||typeof q.lesson!=='string'||!['易','中','難'].includes(q.difficulty)||typeof q.stem!=='string'||!Array.isArray(q.options)||q.options.length!==4||q.options.some(o=>typeof o!=='string')||!Number.isInteger(q.answer)||q.answer<0||q.answer>3||typeof q.explain!=='string')throw Error('invalid');
  ids.add(q.id);
  if(GROUP_TYPES.includes(q.type)){
   if(typeof q.group!=='string'||!q.group||typeof q.passage!=='string'||!q.passage)throw Error('group');
   if(!groups.has(q.group))groups.set(q.group,[]);groups.get(q.group).push(q);
  }else if(Object.hasOwn(q,'group'))throw Error('group');
 }
 for(const group of groups.values())if(group.length!==(group[0].type==='克漏字題組'?4:3)||group.some(q=>q.type!==group[0].type||q.passage!==group[0].passage))throw Error('group');
 return data;
}
home();fetch('./questions.json').then(response=>{if(!response.ok)throw Error('load');return response.json();}).then(data=>{bank=validate(data);loaded=true;prepared=drawRound();home();}).catch(error);
</script>
</body>
