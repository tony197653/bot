<script>

function glossFrom(passage){const at=String(passage||'').indexOf('注釋：');if(at<0)return[];return String(passage).slice(at+3).split('\n').map(line=>line.match(/^\d+\.\s*([^：]+)：(.+)$/)).filter(Boolean).map(m=>[m[1].trim(),m[2].trim()]);}

function normalizeVocab(value){if(!Array.isArray(value))return[];return value.map(item=>Array.isArray(item)&&item.length>=2?[String(item[0]).trim(),String(item[1]).trim()]:null).filter(item=>item&&item[0]&&item[1]);}
function resolveVocab(data,questions){if(data&&!Array.isArray(data)){const top=normalizeVocab(data.vocab);if(top.length)return top;}if(Array.isArray(questions)){for(const q of questions){const rows=normalizeVocab(q&&q.vocab);if(rows.length)return rows;}if(questions[0]&&questions[0].passage)return glossFrom(questions[0].passage);}return[];}
function questionsFrom(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data.questions))return data.questions;if(data&&Array.isArray(data.items))return data.items;throw Error('count');}

function sfxEnv(n,sr,attack,release){let a=Math.max(1,Math.round(attack*sr)),r=Math.max(1,Math.round(release*sr));if(a+r>n){const s=n/(a+r);a=Math.max(1,Math.round(a*s));r=Math.max(1,n-a);}const env=new Float64Array(n).fill(1);for(let i=0;i<a;i++)env[i]=i/a;for(let i=0;i<r;i++){const x=r===1?1:1-i/(r-1);env[n-r+i]=x*x;}return env;}
function renderSfx(spec,ac){const sr=ac.sampleRate,n=Math.round(spec.len*sr),buf=new Float64Array(n);for(const v of spec.voices){const i0=Math.round(v.s*sr);let ln=Math.round(v.d*sr);if(i0>=n||ln<=0)continue;ln=Math.min(ln,n-i0);const env=sfxEnv(ln,sr,v.a,v.r),parts=(v.p||[]).map(p=>({ratio:p[0],amp:p[1],pe:sfxEnv(ln,sr,v.a,Math.min(v.d,v.r*p[2]))}));for(let i=0;i<ln;i++){const t=i/sr;let w=v.sine*Math.sin(2*Math.PI*v.f*t);if(v.tri)w+=v.tri*(2*Math.abs(2*((v.f*t)%1)-1)-1);for(const p of parts)w+=p.amp*Math.sin(2*Math.PI*v.f*p.ratio*t)*p.pe[i];buf[i0+i]+=v.g*env[i]*w;}}let peak=0,mean=0;for(let i=0;i<n;i++){const a=Math.abs(buf[i]);if(a>peak)peak=a;mean+=buf[i];}mean/=n;const out=ac.createBuffer(1,n,sr),ch=out.getChannelData(0);if(peak>0){const k=spec.peak/peak;for(let i=0;i<n;i++)ch[i]=(buf[i]-mean)*k;}return out;}
async function playSfx(kind){try{respectSilentSwitch();if(!await ensureRunning(true))return;if(!ctx||ctx.state!=='running')return;cacheSfx();const buf=sfxBuf[kind];if(!buf)return;respectSilentSwitch();if(ctx.state!=='running')return;const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start(ctx.currentTime+.01);}catch{}}
// Question content is text; only explicitly allowed source tags survive.
function rich(value){const source=new DOMParser().parseFromString(String(value).replace(/\[\[([\s\S]*?)\]\]/g,'<u>$1</u>'),'text/html');const out=document.createElement('span');function copy(node,parent){if(node.nodeType===3){parent.append(document.createTextNode(node.textContent));return;}if(node.nodeType!==1)return;if(['SCRIPT','STYLE','IFRAME','OBJECT','TEMPLATE'].includes(node.tagName))return;const allowed=['U','RUBY','RT','RP','RB','RTC','BR'];const target=allowed.includes(node.tagName)?document.createElement(node.tagName.toLowerCase()):parent;if(target!==parent)parent.append(target);for(const child of node.childNodes)copy(child,target);}for(const node of source.body.childNodes)copy(node,out);return out.innerHTML;}
function scrollToTop(){document.getElementById('scroller').scrollTo(0,0);window.scrollTo(0,0);}
function sourceLink(full){return full?'<p class="source">出處：<a href="https://zh.wikisource.org/zh-hant/%E7%A6%AE%E8%A8%98/%E7%A6%AE%E9%81%8B">《禮記‧禮運》</a>（維基文庫）</p>':'<p class="source">自編模擬題，非歷屆會考試題</p>';}
function action(label,id,secondary=false){return `<button class="btn ${secondary?'b2':'b4'}" id="${id}">${label}</button>`;}
function focusHeading(){main.querySelector('h1,h2')?.focus({preventScroll:true});}

function home(){mode='home';round=[...bank];responses=[];document.getElementById('top').hidden=true;main.className='home-main';main.innerHTML=`<section class="card c1 intro"><h1 tabindex="-1">禮運大同<span class="nw">閱讀測驗</span></h1><p class="description">自編模擬題，非歷屆會考試題。<span class="nw">選文 10 題，答完即看解說。</span></p>${sourceLink(true)}</section><div class="actions">${action(`${!loaded?'<span class="spin" aria-hidden="true"></span>':''}開始作答`,'start')}</div><p class="keys">Enter 開始作答</p>`;document.getElementById('start').disabled=!loaded;document.getElementById('start').setAttribute('aria-busy',String(!loaded));document.getElementById('start').onclick=()=>start(prepared,false);scrollToTop();}
function error(){mode='error';failed=true;document.getElementById('top').hidden=true;main.className='home-main';main.innerHTML=`<section class="card c1 emp"><svg class="art" viewBox="0 0 132 96" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="66" cy="84" rx="44" ry="5" fill="var(--soft-line)"/><path d="M52 22h28M55 22v8c0 3-9 7-9 22a20 20 0 0 0 40 0c0-15-9-19-9-22v-8" stroke="var(--line)" stroke-width="1.6" fill="var(--paper)"/><path d="M47 54c8 4 30 4 38 0M24 70c6-10 14-14 22-12M110 66c-4-8-10-11-17-10" stroke="var(--accent)" stroke-width="1.4"/></svg><p role="alert">題目現在載不進來，請重新整理再試一次。</p>${action('重新整理','reload')}</section>`;document.getElementById('reload').onclick=()=>location.reload();}
function progress(){document.getElementById('top').hidden=false;document.getElementById('progress').textContent=mode==='result'?'本回結束':`${redo?'錯題再練 · ':''}第 ${index+1} 題，共 ${round.length} 題`;const IC={y:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>',n:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>'};document.getElementById('dots').innerHTML=round.map((q,n)=>{const s=responses[n]===undefined?'':responses[n]===q.answer?'y':'n';return `<span class="dot ${s} ${mode==='quiz'&&n===index?'now':''}"><span class="c">${s?IC[s]:n+1}</span></span>`;}).join('');}
function start(list,isRedo){if(!loaded||!list.length)return;round=[...list];responses=[];index=0;redo=isRedo;mode='quiz';main.innerHTML=`<div class="layout"><div class="reading-column"><aside id="passage" class="card c1 passage" hidden></aside>${vocabularyHTML()}</div><section class="question-column" id="question"></section></div>`;document.getElementById('vocabulary-title').onclick=()=>setVocabularyExpanded(document.getElementById('vocabulary-title').getAttribute('aria-expanded')!=='true');show();}



const explanationTextFields=['why','examFocus','commonMistake','extension'];
const explanationFields=[...explanationTextFields,'wrongReasons'];
function wrongLetters(q){return [...LETTERS].filter((letter,n)=>n!==q.answer);}
function hasText(value){return typeof value==='string'&&value.trim()!=='';}
function hasCompleteExplanation(q){
  const reasons=q.wrongReasons;
  const letters=wrongLetters(q);
  return explanationTextFields.every(field=>hasText(q[field])) &&
    reasons!==null && typeof reasons==='object' && !Array.isArray(reasons) &&
    Object.keys(reasons).length===letters.length &&
    letters.every(letter=>Object.hasOwn(reasons,letter)&&hasText(reasons[letter]));
}
const lifeKnowledgeTitles={
  life:'知識延伸－生活應用',
  world:'知識延伸－真實世界',
  think:'知識延伸－想一想'
};
function lifeKnowledgeHTML(knowledge){
  if(!knowledge||typeof knowledge!=='object'||Array.isArray(knowledge))return '';
  const {type,text,hint}=knowledge;
  if(typeof type!=='string'||!Object.hasOwn(lifeKnowledgeTitles,type)||!hasText(text))return '';
  const hintControl=type==='think'&&hasText(hint)?`<button class="life-knowledge-toggle" type="button" aria-expanded="false">查看思考方向</button><p class="life-knowledge-hint" hidden>${rich(hint)}</p>`:'';
  return `<p>${rich(text)}</p>`+hintControl;
}
function explanationHTML(q,choice){
  const verdict=`${choice===q.answer?'答對':'答錯'}，正確答案是 ${LETTERS[q.answer]}`;
  const firstLine=`<p class="verdict">${verdict}</p>`;
  if(!hasCompleteExplanation(q))return firstLine+`<p>${rich(q.explain)}</p>`;
  const block=(title,body)=>`<section class="exp-block"><h3>${title}</h3>${body}</section>`;
  const paragraph=value=>`<p>${rich(value)}</p>`;
  const reasons=wrongLetters(q).map(letter=>`<p class="wrong-line"><span class="ltr">${letter}</span><span class="txt">${rich(q.wrongReasons[letter])}</span></p>`).join('');
  const knowledge=q.lifeKnowledge;
  const knowledgeBody=lifeKnowledgeHTML(knowledge);
  return firstLine+
    paragraph(q.why)+
    block('其他選項錯在哪',reasons)+
    block('常考重點',paragraph(q.examFocus))+
    block('易錯觀念',paragraph(q.commonMistake))+
    (knowledgeBody?block(lifeKnowledgeTitles[knowledge.type],knowledgeBody):block('知識延伸',paragraph(q.extension)));
}
function show(){mode='quiz';const q=round[index];progress();const passage=document.getElementById('passage');const sameGroup=!!q.groupId&&passage.dataset.group===q.groupId;main.className=q.groupId?'reading-main':'';passage.hidden=!q.groupId;if(q.groupId&&!sameGroup){passage.innerHTML=`<h2>閱讀篇章 · ${rich(q.lesson)}</h2><p>${rich(displayPassage(q.passage))}</p>${sourceLink()}`;passage.dataset.group=q.groupId;passage.scrollTop=0;}else if(!q.groupId){delete passage.dataset.group;}
const column=document.getElementById('question');column.innerHTML=`<div class="card c1 question-card"><div class="tags"><span class="tag l2"><i aria-hidden="true"></i>${q.type}</span>${q.sample?'<span class="tag l2">範例</span>':''}</div><h2 tabindex="-1">${rich(q.stem)}</h2></div><div class="options" role="group" aria-label="答案選項">${q.options.map((o,n)=>`<button class="opt" data-choice="${n}"><span class="bubble">${LETTERS[n]}</span><span class="option-text">${rich(o)}</span><span class="marks"></span></button>`).join('')}</div><div class="actions" id="next-action"></div><div id="explanation" class="explanation pending" aria-hidden="true">${explanationHTML(q,(q.answer+1)%4)}</div><p class="keys">方向鍵選答案，Enter／空白鍵確認；1–4 直接作答</p>`;column.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(Number(b.dataset.choice)));column.scrollTop=0;if(!sameGroup)scrollToTop();focusHeading();}

function pick(choice){if(mode!=='quiz'||responses[index]!==undefined)return;const q=round[index];responses[index]=choice;collapseVocabularyAfterAnswer();if(choice===q.answer)playSfx('ok');else playSfx('bad');document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n===q.answer){b.classList.add('correct');b.querySelector('.marks').textContent=choice===n?'正確 · 你的選擇':'正確';}else if(n===choice){b.classList.add('wrong');b.querySelector('.marks').textContent='你的選擇';}});const note=document.getElementById('explanation');note.innerHTML=explanationHTML(q,choice);note.classList.remove('pending');note.removeAttribute('aria-hidden');note.setAttribute('role','status');document.getElementById('next-action').innerHTML=action(index===round.length-1?'看成績':'下一題','next');document.getElementById('next').onclick=next;progress();document.getElementById('next').focus({preventScroll:true});}

function next(){if(mode!=='quiz'||responses[index]===undefined)return;if(index+1<round.length){index++;show();}else result();}
function result(){mode='result';progress();const wrong=round.filter((q,n)=>responses[n]!==q.answer);const score=round.length-wrong.length;const percentage=Math.round(score/round.length*100);const ratio=score/round.length;const comment=ratio===1?'全部答對。':ratio>=.8?'觀念很清楚，錯的幾題看一下解說就好。':ratio>=.6?'及格了，把錯題再練一次會更穩。':'先看下面的解說，再練一次錯題。';main.className='';main.innerHTML=`<section class="summary"><h1 class="score" tabindex="-1" aria-label="答對 ${score} 題，共 ${round.length} 題">${score} <small>／ ${round.length}</small></h1><p>正確率 ${percentage}%。${comment}</p></section><div class="actions result-actions">${wrong.length?action(`再練錯的 ${wrong.length} 題`,'redo'):''}${action('從頭再做一次','restart',true)}</div>${wrong.length?`<section class="review"><h2>答錯的題目</h2>${round.map((q,n)=>responses[n]===q.answer?'':`<article class="card c1">${q.groupId?`<p class="excerpt">閱讀篇章 · ${rich(q.lesson)}<br>${rich(displayPassage(q.passage))}</p>`:''}<h3>${rich(q.stem)}</h3><p>你選：${LETTERS[responses[n]]} · ${rich(q.options[responses[n]])}</p><p>正確：${LETTERS[q.answer]} · ${rich(q.options[q.answer])}</p><div class="explanation">${explanationHTML(q,responses[n])}</div></article>`).join('')}</section>`:''}`;if(wrong.length)document.getElementById('redo').onclick=()=>start(wrong,true);document.getElementById('restart').onclick=()=>{prepared=[...bank];home();focusHeading();};scrollToTop();focusHeading();playSfx('score');}

function validate(data){
 if(!Array.isArray(data)||data.length!==10)throw Error('count');
 const ids=new Set();
 for(const q of data){
  if(!q||typeof q.id!=='string'||!q.id||ids.has(q.id)||!['字音字形','詞語成語','閱讀理解'].includes(q.type)||typeof q.lesson!=='string'||!['易','中','難'].includes(q.difficulty)||typeof q.stem!=='string'||!Array.isArray(q.options)||q.options.length!==4||q.options.some(o=>typeof o!=='string')||!Number.isInteger(q.answer)||q.answer<0||q.answer>3||typeof q.explain!=='string')throw Error('invalid');
  ids.add(q.id);
  if(typeof q.group!=='string'||!q.group.trim()||typeof q.passage!=='string'||!q.passage.trim()||q.group!==data[0].group||q.passage!==data[0].passage)throw Error('group');
 }
 return data;
}

home();fetch('./questions.json').then(response=>{if(!response.ok)throw Error('load');return response.json();}).then(data=>{const questions=questionsFrom(data);bank=validate(questions.map(q=>({...q,group:q.groupId})));VOCABULARY=resolveVocab(data,bank);loaded=true;prepared=[...bank];home();}).catch(error);
</script>
