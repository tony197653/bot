<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10261d">
<link rel="icon" href="data:,">
<title>週五牌局 · 德州撲克</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
<style>
.mini-hole{display:none}
.top-tools .mute{gap:4px}
#btnTimerCfg,#btnLobby{font-size:13px}
@media (min-width:1024px){
  .mini-hole{display:flex;gap:2px;margin-top:4px;justify-content:center}
  .mini-hole .card{width:28px;height:40px;border-radius:4px}
  .mini-hole .rk{font-size:11px;left:3px;top:2px}
  .mini-hole .sm{display:none}
  .mini-hole .big{width:14px;height:14px;right:3px;bottom:3px}
}
</style>
</head>
<body>
<div class="boot" id="boot" aria-live="polite">
  <div class="boot-card">
    <h1>週五牌局</h1>
    <p>經典綠色牌桌 · 熱座模式</p>
    <div class="bar" aria-hidden="true"><i id="bootBar"></i></div>
    <div class="boot-pct" id="bootPct">準備中 0%</div>
  </div>
</div>

<div class="app hidden" id="app">
  <header class="top">
    <div class="room">
      <h1 id="roomTitle">週五牌局</h1>
      <p id="roomMeta">無限注 <b>盲注 10／20</b>　第 0 手</p>
    </div>
    <div class="top-tools">
      <button class="mute" type="button" id="btnTimerCfg" title="測試時可關閉計時">計時關</button>
      <button class="mute" type="button" id="btnLobby">大廳</button>
      <button class="mute" type="button" id="btnMute" aria-pressed="false" aria-label="音效（里程碑 5）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>音效</span>
      </button>
    </div>
  </header>

  <main class="stage" aria-label="牌桌">
    <div class="table">
      <div class="felt"><span class="logo">德州撲克</span></div>
      <div class="pot">
        <div class="lbl">底池</div>
        <div class="amt" id="potAmt">0</div>
        <div class="sub" id="potSub"></div>
      </div>
      <div class="board" id="board" aria-label="公共牌">
        <span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span>
      </div>
      <div id="bets"></div>
      <div id="seats"></div>
      <div class="dealer" id="dealer" title="莊家">D</div>
    </div>
    <div class="me">
      <div class="hole" id="heroHole" aria-label="你的手牌"></div>
      <div class="meinfo">
        <div class="timer" aria-label="剩餘秒數">
          <svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="20"/><circle class="fg" id="timerFg" cx="23" cy="23" r="20" style="stroke-dasharray:125.66;stroke-dashoffset:0"/></svg>
          <span id="timerSec">—</span>
        </div>
        <div><b id="heroName">—</b><strong id="heroChips">0</strong></div>
      </div>
    </div>
  </main>

  <aside class="side">
    <section class="info" id="sideInfo"><h2>牌局資訊</h2></section>
    <section class="log" id="sideLog"><h2>這一手</h2><ol></ol></section>
  </aside>

  <section class="act" id="act" aria-label="你的動作">
    <div class="turn"><b id="turnTitle">準備中</b><span id="turnHint"></span></div>
    <div class="raise hidden" id="raiseWrap">
      <input type="range" id="raiseRange" min="0" max="0" value="0" aria-label="加注金額">
      <output id="raiseOut">0</output>
    </div>
    <div class="presets hidden" id="presets"></div>
    <div class="show-btns hidden" id="showBtns"></div>
    <div class="btns" id="btns"></div>
  </section>
</div>

<div class="screen" id="lobbyScreen" role="dialog" aria-labelledby="lobbyTitle">
  <div class="sheet">
    <h2 id="lobbyTitle">開一桌熱座牌局</h2>
    <p class="lead">單機傳裝置輪流操作。規則引擎在本機執行，之後里程碑可同步到 Firebase。</p>
    <label for="roomNameInput">牌局名稱</label>
    <input id="roomNameInput" type="text" maxlength="40" value="週五牌局">
    <div class="row">
      <div>
        <label for="bbInput">大盲</label>
        <input id="bbInput" type="number" min="2" step="2" value="20">
      </div>
      <div>
        <label for="stackInput">起始籌碼（≥100×大盲）</label>
        <input id="stackInput" type="number" min="200" step="100" value="2000">
      </div>
    </div>
    <label><input type="checkbox" id="timerToggle"> 啟用 30 秒行動計時（測試可關）</label>
    <p class="lead" style="margin-top:14px;margin-bottom:0">玩家（2–6 人）</p>
    <div class="players-edit" id="playerRows"></div>
    <div class="actions">
      <button type="button" class="primary" id="btnStart">開始牌局</button>
    </div>
  </div>
</div>

<div class="screen" id="passScreen" role="dialog" aria-labelledby="passTitle">
  <div class="sheet" style="text-align:center">
    <h2 id="passTitle">換人</h2>
    <p class="lead" id="passHint">請把裝置交給下一位玩家。</p>
    <div class="pass-name" id="passName">—</div>
    <div class="actions">
      <button type="button" class="primary" id="btnPassOk">我是這位玩家，開始</button>
    </div>
  </div>
</div>

<div class="screen" id="summaryScreen" role="dialog" aria-labelledby="sumTitle">
  <div class="sheet">
    <h2 id="sumTitle">本場戰績</h2>
    <div id="summaryBody"></div>
    <div class="actions">
      <button type="button" class="primary" id="btnSummaryClose">關閉</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/ui/app.js"></script>
</body>
</html>
