<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13231a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="週五牌局">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>週五牌局 · 德州撲克</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div class="boot" id="boot" aria-live="polite">
  <div class="boot-card">
    <h1>週五牌局</h1>
    <p>經典綠色牌桌 · 熱座模式</p>
    <div class="bar" aria-hidden="true"><i id="bootBar"></i></div>
    <div class="boot-pct" id="bootPct">準備中 0%</div>
  </div>
</div>

<div class="app hidden" id="app">
  <header class="top">
    <div class="room">
      <h1 id="roomTitle">週五牌局</h1>
      <p id="roomMeta"><span class="meta-a"><b>盲注 10／20</b></span><span class="meta-b">　第 0 手</span></p>
    </div>
    <button type="button" class="menu-btn" id="btnMenu" aria-label="選單" aria-expanded="false" aria-controls="menuPop">
      <i></i><i></i><i></i>
    </button>
    <div class="menu-pop hidden" id="menuPop" role="menu">
      <div class="menu-meta" id="menuMeta">第 0 手 · 房號 —</div>
      <div class="menu-meta" id="menuHost">房主 —</div>
      <button type="button" id="btnTimerCfg" role="menuitem">計時關</button>
      <button type="button" class="hidden" id="btnFullscreen" role="menuitem">全螢幕</button>
      <button type="button" id="btnMute" role="menuitem" aria-pressed="false">音效</button>
      <button type="button" id="btnLobby" role="menuitem">大廳</button>
      <button type="button" id="btnEndMenu" role="menuitem">結束牌局</button>
    </div>
  </header>

  <main class="stage" aria-label="牌桌">
    <div class="table">
      <div class="rail"><div class="felt"><span class="logo">德州撲克</span></div></div>
      <div class="pot" id="potRoot">
        <div class="stack" aria-hidden="true"><span class="chip"></span><span class="chip"></span></div>
        <div class="amt" id="potAmt">0</div>
        <div class="lbl">底池</div>
        <div class="sub" id="potSub"></div>
      </div>
      <div class="board" id="board" aria-label="公共牌"></div>
      <div id="bets"></div>
      <div id="seats"></div>
      <div class="dealer" id="dealer" title="莊家">D</div>
      <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
    </div>
    <div class="me" id="meRoot">
      <div class="hole" id="heroHole" aria-label="你的手牌"></div>
      <div class="meinfo" id="mePlate">
        <div class="av" id="heroAv">—</div>
        <div>
          <b id="heroName">—</b>
          <strong id="heroChips">0</strong>
        </div>
        <!-- Action timer lives in ☰; no ring on the nameplate (avoids stray ⊖ on the border) -->
      </div>
    </div>
  </main>

  <aside class="side">
    <section class="info" id="sideInfo"><h2>牌局資訊</h2></section>
    <section class="log" id="sideLog"><h2>這一手</h2><ol></ol></section>
  </aside>

  <section class="act" id="act" aria-label="你的動作">
    <div class="turn"><b id="turnTitle">準備中</b><span id="turnHint"></span></div>
    <div class="show-cd hidden" id="showCd"></div>
    <div class="show-btns hidden" id="showBtns"></div>
    <div class="btns" id="btns"></div>
  </section>
</div>

<div class="raise-scrim" id="raiseScrim" hidden></div>
<div class="raise-panel" id="raisePanel" hidden aria-label="加注">
  <div class="ph">
    <b>加注到 <span class="big" id="raiseOut">0</span></b>
    <span id="raiseHint">—</span>
  </div>
  <div class="raise" id="raiseWrap">
    <button type="button" class="raise-step" id="raiseMinus" aria-label="減少一大盲">−</button>
    <div class="raise-track">
      <input type="range" id="raiseRange" min="0" max="0" value="0" aria-label="加注金額">
    </div>
    <button type="button" class="raise-step" id="raisePlus" aria-label="增加一大盲">＋</button>
  </div>
  <div class="presets" id="presets"></div>
  <div class="raise-actions">
    <button type="button" class="cancel" id="raiseCancel">取消</button>
    <button type="button" class="ok" id="raiseConfirm">確認加注</button>
  </div>
</div>

<div class="screen" id="lobbyScreen" role="dialog" aria-labelledby="lobbyTitle">
  <div class="sheet sheet-lobby">
    <div class="sheet-body">
      <h2 id="lobbyTitle">開一桌熱座牌局</h2>
      <p class="lead">單機傳裝置輪流操作。規則引擎在本機執行，之後里程碑可同步到 Firebase。</p>
      <label for="roomNameInput">牌局名稱</label>
      <input id="roomNameInput" type="text" maxlength="40" value="週五牌局">
      <div class="row">
        <div>
          <label for="bbInput">大盲</label>
          <input id="bbInput" type="number" min="2" step="2" value="20">
        </div>
        <div>
          <label for="stackInput">起始籌碼（≥100×大盲）</label>
          <input id="stackInput" type="number" min="200" step="100" value="2000">
        </div>
      </div>
      <label><input type="checkbox" id="timerToggle"> 啟用 30 秒行動計時（測試可關）</label>
      <p class="lead" style="margin-top:14px;margin-bottom:0">玩家（2–6 人）</p>
      <div class="players-edit" id="playerRows"></div>
    </div>
    <div class="sheet-foot">
      <div class="actions">
        <button type="button" class="primary" id="btnStart">開始牌局</button>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="passScreen" role="dialog" aria-labelledby="passTitle">
  <div class="sheet" style="text-align:center">
    <h2 id="passTitle">換人</h2>
    <p class="lead" id="passHint">請把裝置交給下一位玩家。</p>
    <div class="pass-name" id="passName">—</div>
    <div class="actions">
      <button type="button" class="primary" id="btnPassOk">我是這位玩家，開始</button>
    </div>
  </div>
</div>

<div class="screen" id="summaryScreen" role="dialog" aria-labelledby="sumTitle">
  <div class="sheet">
    <h2 id="sumTitle">本場戰績</h2>
    <div id="summaryBody"></div>
    <div class="actions">
      <button type="button" class="primary" id="btnSummaryClose">關閉</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/ui/app.js"></script>
</body>
</html>
