name: Deploy poker to Firebase Hosting

# Previews only. Live is never released from GitHub Actions.
# Release live only via scripts/promote-live.mjs (see deploy/README.md).
on:
  pull_request:
    paths:
      - 'poker/**'
      - 'lib/**'
  push:
    branches: [main]
    paths:
      - 'poker/**'
      - 'lib/**'

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage hosting public/
        run: bash poker/firebase/stage.sh

      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TONY_POKER }}
          projectId: tony-poker
          entryPoint: poker/firebase
          expires: 7d

      # Tip-of-main preview only (channel "main"). Not live.
      - name: Deploy main preview channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TONY_POKER }}
          projectId: tony-poker
          entryPoint: poker/firebase
          channelId: main
          expires: 30d
