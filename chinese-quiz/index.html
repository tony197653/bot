<!doctype html>
<html lang="zh-Hant-TW">
<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect fill=%22%2364745b%22 width=%2232%22 height=%2232%22 rx=%226%22/></svg>">
<title>國三國文複習測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bopomofo&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--paper:#fffefa;--ink:#343d32;--muted:#62675c;--line:#b7bcaf;--soft-line:#dfe1d7;--sage:#64745b;--sage-soft:#e3e8dc;--sage-hover:#d6dfce;--ok:#46633e;--ok-soft:#edf2e7;--bad:#964c3f;--bad-soft:#f6e9e3;--r-xs:6px;--r-sm:8px;--r:12px;--r-lg:20px;--ease:cubic-bezier(.2,.7,.3,1)}
*{box-sizing:border-box}[hidden]{display:none!important}html{font-size:100%;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 "Noto Sans Bopomofo", "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif}button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,[tabindex="-1"]:focus-visible{outline:2px solid var(--sage);outline-offset:4px}button:disabled{cursor:default}h1,h2,h3,p{margin:0}h1{font-size:1.75rem;line-height:1.5;font-weight:700;letter-spacing:.02em}h2{font-size:1.25rem;line-height:1.7}h3{font-size:1.0625rem}u{text-underline-offset:5px;text-decoration-thickness:1.5px}ruby{ruby-position:over}rt{font-size:.65em}main{max-width:752px;margin:auto;padding:32px 16px calc(120px + env(safe-area-inset-bottom))}.card{display:block;width:100%;border-radius:var(--r);background:var(--paper);color:inherit}.c1{padding:24px 16px;border:1px solid var(--line);transition:transform .22s var(--ease),border-color .22s var(--ease)}.intro{min-height:530px;padding-top:28px}.intro h1{margin-bottom:16px}.description{color:var(--muted)}fieldset{border:0;padding:0;margin:28px 0 0;min-width:0}legend{padding:0;margin-bottom:12px;font-weight:500}.hint{font-weight:400;color:var(--muted);font-size:.875rem}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{flex:0 0 calc((100% - 16px)/3);min-height:44px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 3px;font-size:.875rem;line-height:1.6;cursor:pointer;transition:transform .12s var(--ease),background-color .18s var(--ease),border-color .18s var(--ease)}.chip[aria-pressed=true]{background:#a9b79f;border-color:#94a48a;color:#26331f;font-weight:600}.count{margin-top:18px;color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;padding:10px 24px;font-weight:600;cursor:pointer;transition:transform .12s var(--ease),background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}.b4{background:var(--sage-soft);color:#3e5136;border:1px solid #9fac94;border-radius:var(--r)}.b2{background:transparent;border:1px solid var(--line);border-radius:var(--r-sm)}.b4:active{background:#cbd6c2}.b2:active{background:var(--sage-soft)}button:active:not(:disabled){transform:scale(.97)}.b4:disabled{background:#e8e9e2;color:#62675c;border-color:#c9ccc1;cursor:wait}.actions{display:flex;gap:8px;margin-top:24px}.actions .btn{width:100%}.actions:empty{display:none}.actions{position:fixed;z-index:5;bottom:0;left:0;right:0;margin:0;padding:14px max(16px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));background:var(--bg);border-top:1px solid var(--soft-line)}.result-actions{flex-direction:column}body:has(.result-actions) main{padding-bottom:calc(184px + env(safe-area-inset-bottom))}.top{background:#eeeee6;border-bottom:1px solid var(--soft-line)}.top-inner{max-width:1280px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.progress{font-size:.9375rem}.dots{display:flex;flex-wrap:wrap;gap:8px}.dot{width:16px;height:16px;border:1px solid #969f8d;border-radius:50%;display:grid;place-items:center;font:600 11px/1 sans-serif}.dot.now{outline:2px solid var(--sage);outline-offset:2px}.dot.y{background:var(--ok);border-color:var(--ok);color:white}.dot.n{background:var(--bad);border-color:var(--bad);color:white}.layout{display:grid;gap:20px}.passage{line-height:2;white-space:pre-wrap;font-family:"Noto Serif TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",serif}.passage h2{font-size:1rem;color:var(--muted);font-weight:500;margin-bottom:20px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;line-height:1.5}.l2{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}.l2 i{width:7px;height:7px;border-radius:50%;background:var(--sage)}.question-card{margin-bottom:16px}.options{display:grid;gap:8px}.opt{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--paper);text-align:left;cursor:pointer;transition:transform .12s var(--ease),background-color .18s var(--ease),border-color .18s var(--ease)}.bubble{flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:.875rem;line-height:1}.option-text{flex:1;min-width:0}.marks{font-size:.8125rem;font-weight:600;flex:none;white-space:nowrap;margin-left:8px}.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:#354b2f}.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:#803d32}.opt:disabled{opacity:1}.explanation{margin-top:20px;padding:18px 16px;border-radius:var(--r);background:#eeeee6;transition:opacity .18s var(--ease)}.explanation.pending{visibility:hidden;opacity:0}.explanation strong{font-weight:600}.keys{display:none;color:var(--muted);font-size:.8125rem;margin:18px 0 0}.score{font-size:4rem;line-height:1.4;font-weight:600;font-variant-numeric:tabular-nums}.score small{font-size:1.5rem;font-weight:400;color:var(--muted)}.summary{padding:12px 0 24px}.summary p{margin-top:12px}.review{margin-top:32px}.review>h2{margin-bottom:16px}.review article+article{margin-top:16px}.review h3{margin-bottom:14px}.review p+p{margin-top:8px}.review .excerpt{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--soft-line);color:var(--muted);white-space:pre-wrap}.emp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:32px 0}.emp .art{width:132px;height:96px}.emp p{max-width:24em}.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:800px){body{font-size:17px}main{padding:32px 16px 60px}.home-main{padding-top:88px}.intro{padding:36px 32px;min-height:390px}h1{font-size:2rem}.chip{flex:1;padding:8px 10px}.chips{flex-wrap:nowrap}.c1{padding:26px}.intro.c1{padding:36px 32px}.top-inner{flex-direction:row;align-items:center;gap:28px;padding:20px 32px}.actions{position:static;border:0;padding:0;background:transparent;margin-top:24px;justify-content:flex-start}.actions .btn{width:auto;min-width:200px}.home-main>.actions{justify-content:center}.result-actions{flex-direction:row}.reading-main{max-width:1280px}.reading-main .layout{grid-template-columns:1fr 1.08fr;gap:24px;height:calc(100dvh - 138px);min-height:300px}.reading-main .passage,.reading-main .question-column{overflow-y:auto;overscroll-behavior:contain;min-width:0}.reading-main .passage{height:100%}.question-column{padding:4px 4px 24px}.reading-main .question-column{padding-top:0}body:has(.result-actions) main{padding-bottom:60px}}
@media(hover:hover) and (pointer:fine){.b4:hover:not(:disabled){background:var(--sage-hover)}.chip[aria-pressed=true]:hover{background:#9cab92}.b2:hover,.chip[aria-pressed=false]:hover{background:var(--paper);border-color:var(--sage)}.opt:hover:not(:disabled){background:#f0f2e9;border-color:var(--sage)}.c1:hover{transform:translateY(-4px);border-color:#9da991}.keys{display:block}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transform:none!important;transition:opacity .08s!important;animation:none!important}.spin{border-right-color:currentColor}}
@media(prefers-contrast:more){:root{--line:#626d59;--soft-line:#8a9282;--muted:#424a3b}.opt,.c1,.chip{border-width:2px}}
@media(prefers-reduced-transparency:reduce){.actions,.card,.opt{background-color:var(--paper)}}
</style>
</head>
<body>
<header class="top" id="top" hidden><div class="top-inner"><p class="progress" id="progress" aria-live="polite"></p><div class="dots" id="dots" aria-hidden="true"></div></div></header>
<main id="main" class="home-main"></main>
<script>
'use strict';
const TYPES=['字音字形','詞語成語','修辭與句型','國學常識','閱讀理解'];
const LETTERS='ABCD';
const main=document.getElementById('main');
let bank=[],selected=new Set(TYPES),prepared=[],round=[],responses=[],index=0,mode='home',redo=false,loaded=false,failed=false;
const shuffle=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
// Only ruby markup is accepted; all attributes and other markup are discarded.
function rich(value){const source=new DOMParser().parseFromString(String(value).replace(/\[\[([\s\S]*?)\]\]/g,'<u>$1</u>'),'text/html');const out=document.createElement('span');function copy(node,parent){if(node.nodeType===3){parent.append(document.createTextNode(node.textContent));return;}if(node.nodeType!==1)return;if(['SCRIPT','STYLE','IFRAME','OBJECT','TEMPLATE'].includes(node.tagName))return;const allowed=['U','RUBY','RT','RP','RB','RTC','BR'];const target=allowed.includes(node.tagName)?document.createElement(node.tagName.toLowerCase()):parent;if(target!==parent)parent.append(target);for(const child of node.childNodes)copy(child,target);}for(const node of source.body.childNodes)copy(node,out);return out.innerHTML;}
function drawRound(){const readingGroups=new Map();for(const q of bank)if(q.type==='閱讀理解'){if(!readingGroups.has(q.groupId))readingGroups.set(q.groupId,[]);readingGroups.get(q.groupId).push(q);}let groups=selected.has('閱讀理解')?shuffle([...readingGroups.values()]):[];const others=TYPES.filter(t=>t!=='閱讀理解'&&selected.has(t));if(!others.length){let result=[];for(const group of groups){if(result.length>=10)break;result.push(...group);}return result;}const reading=groups[0]||[];let available=shuffle(bank.filter(q=>others.includes(q.type)));const chosen=[];for(const type of shuffle(others)){const at=available.findIndex(q=>q.type===type);if(at>=0&&chosen.length<10-reading.length)chosen.push(...available.splice(at,1));}chosen.push(...available.slice(0,Math.max(0,10-reading.length-chosen.length)));const result=shuffle(chosen);if(reading.length)result.splice(Math.floor(Math.random()*(result.length+1)),0,...reading);return result;}
function action(label,id,secondary=false){return `<button class="btn ${secondary?'b2':'b4'}" id="${id}">${label}</button>`;}
function focusHeading(){main.querySelector('h1,h2')?.focus({preventScroll:true});}
function home(){mode='home';round=[];responses=[];document.getElementById('top').hidden=true;main.className='home-main';main.innerHTML=`<section class="card c1 intro"><h1 tabindex="-1">國三國文複習測驗</h1><p class="description">範圍是各版本都有的共同範文。答完立刻看解說，不會留下成績。</p><fieldset><legend>要練的題型<span class="hint">（點一下可取消）</span></legend><div class="chips">${TYPES.map(t=>`<button class="chip" aria-pressed="${selected.has(t)}" data-type="${t}">${t}</button>`).join('')}</div></fieldset><p class="count" id="count" aria-live="polite">${loaded?`本回 ${prepared.length} 題`:''}</p></section><div class="actions">${action(`${!loaded?'<span class="spin" aria-hidden="true"></span>':''}開始作答`,'start')}</div><p class="keys">Enter 開始作答</p>`;document.getElementById('start').disabled=!loaded;document.getElementById('start').setAttribute('aria-busy',String(!loaded));document.getElementById('start').onclick=()=>start(prepared,false);main.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const t=b.dataset.type;if(selected.has(t)){if(selected.size===1)return;selected.delete(t);}else selected.add(t);b.setAttribute('aria-pressed',String(selected.has(t)));if(loaded){prepared=drawRound();document.getElementById('count').textContent=`本回 ${prepared.length} 題`;document.getElementById('start').disabled=!prepared.length;}});window.scrollTo(0,0);}
function error(){mode='error';failed=true;document.getElementById('top').hidden=true;main.className='home-main';main.innerHTML=`<section class="card c1 emp"><svg class="art" viewBox="0 0 132 96" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="66" cy="84" rx="44" ry="5" fill="#e2e4dc"/><path d="M52 22h28M55 22v8c0 3-9 7-9 22a20 20 0 0 0 40 0c0-15-9-19-9-22v-8" stroke="#8a8e83" stroke-width="1.6" fill="#f7f7f3"/><path d="M47 54c8 4 30 4 38 0M24 70c6-10 14-14 22-12M110 66c-4-8-10-11-17-10" stroke="#9da58e" stroke-width="1.4"/></svg><p role="alert">題目現在載不進來，請重新整理再試一次。</p>${action('重新整理','reload')}</section>`;document.getElementById('reload').onclick=()=>location.reload();}
function progress(){document.getElementById('top').hidden=false;document.getElementById('progress').textContent=mode==='result'?'本回結束':`${redo?'錯題再練 · ':''}第 ${index+1} 題，共 ${round.length} 題`;document.getElementById('dots').innerHTML=round.map((q,n)=>`<span class="dot ${responses[n]===undefined?'':responses[n]===q.answer?'y':'n'} ${mode==='quiz'&&n===index?'now':''}">${responses[n]===undefined?'':responses[n]===q.answer?'✓':'×'}</span>`).join('');}
function start(list,isRedo){if(!loaded||!list.length)return;round=[...list];responses=[];index=0;redo=isRedo;mode='quiz';main.innerHTML='<div class="layout"><aside id="passage" class="card c1 passage" hidden></aside><section class="question-column" id="question"></section></div>';show();}
function feedback(q,pick){return `${pick===q.answer?'答對。':`答錯，正確答案是 ${LETTERS[q.answer]}。`} ${q.explain}`;}
function show(){mode='quiz';const q=round[index];progress();const passage=document.getElementById('passage');const sameGroup=!!q.groupId&&passage.dataset.group===q.groupId;main.className=q.groupId?'reading-main':'';passage.hidden=!q.groupId;if(q.groupId&&!sameGroup){passage.innerHTML=`<h2>閱讀篇章 · ${rich(q.lesson)}</h2><p>${rich(q.passage)}</p>`;passage.dataset.group=q.groupId;passage.scrollTop=0;}else if(!q.groupId){delete passage.dataset.group;}
const column=document.getElementById('question');column.innerHTML=`<div class="card c1 question-card"><div class="tags"><span class="tag l2"><i aria-hidden="true"></i>${q.type}</span>${q.sample?'<span class="tag l2">範例</span>':''}</div><h2 tabindex="-1">${rich(q.stem)}</h2></div><div class="options" role="group" aria-label="答案選項">${q.options.map((o,n)=>`<button class="opt" data-choice="${n}"><span class="bubble">${LETTERS[n]}</span><span class="option-text">${rich(o)}</span><span class="marks"></span></button>`).join('')}</div><div id="explanation" class="explanation pending" aria-hidden="true">${rich(feedback(q,(q.answer+1)%4))}</div><div class="actions" id="next-action"></div><p class="keys">方向鍵選答案，Enter／空白鍵確認；1–4 直接作答</p>`;column.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(Number(b.dataset.choice)));column.scrollTop=0;if(!sameGroup)window.scrollTo(0,0);focusHeading();}
function pick(choice){if(mode!=='quiz'||responses[index]!==undefined)return;const q=round[index];responses[index]=choice;document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n===q.answer){b.classList.add('correct');b.querySelector('.marks').textContent=choice===n?'正確 · 你的選擇':'正確';}else if(n===choice){b.classList.add('wrong');b.querySelector('.marks').textContent='你的選擇';}});const note=document.getElementById('explanation');note.innerHTML=rich(feedback(q,choice));note.classList.remove('pending');note.removeAttribute('aria-hidden');note.setAttribute('role','status');document.getElementById('next-action').innerHTML=action(index===round.length-1?'看成績':'下一題','next');document.getElementById('next').onclick=next;progress();document.getElementById('next').focus({preventScroll:true});}
function next(){if(mode!=='quiz'||responses[index]===undefined)return;if(index+1<round.length){index++;show();}else result();}
function result(){mode='result';progress();const wrong=round.filter((q,n)=>responses[n]!==q.answer);const score=round.length-wrong.length;const percentage=Math.round(score/round.length*100);const ratio=score/round.length;const comment=ratio===1?'全部答對。':ratio>=.8?'觀念很清楚，錯的幾題看一下解說就好。':ratio>=.6?'及格了，把錯題再練一次會更穩。':'先看下面的解說，再練一次錯題。';main.className='';main.innerHTML=`<section class="summary"><h1 class="score" tabindex="-1" aria-label="答對 ${score} 題，共 ${round.length} 題">${score} <small>／ ${round.length}</small></h1><p>正確率 ${percentage}%。${comment}</p></section><div class="actions result-actions">${wrong.length?action(`再練錯的 ${wrong.length} 題`,'redo'):''}${action('從頭再做一次','restart',true)}</div>${wrong.length?`<section class="review"><h2>答錯的題目</h2>${round.map((q,n)=>responses[n]===q.answer?'':`<article class="card c1">${q.groupId?`<p class="excerpt">閱讀篇章 · ${rich(q.lesson)}<br>${rich(q.passage)}</p>`:''}<h3>${rich(q.stem)}</h3><p>你選：${LETTERS[responses[n]]} · ${rich(q.options[responses[n]])}</p><p>正確：${LETTERS[q.answer]} · ${rich(q.options[q.answer])}</p><p>${rich(q.explain)}</p></article>`).join('')}</section>`:''}`;if(wrong.length)document.getElementById('redo').onclick=()=>start(wrong,true);document.getElementById('restart').onclick=()=>{prepared=drawRound();home();focusHeading();};window.scrollTo(0,0);focusHeading();}
document.addEventListener('keydown',event=>{if(event.repeat||event.altKey||event.ctrlKey||event.metaKey||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;const key=event.key;if(mode==='home'&&key==='Enter'){if(event.target.closest('.chip'))return;event.preventDefault();if(loaded&&!failed)start(prepared,false);return;}if(mode!=='quiz')return;const answered=responses[index]!==undefined;if(/^[1-4]$/.test(key)&&!answered){event.preventDefault();pick(Number(key)-1);return;}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)&&!answered){event.preventDefault();const buttons=[...document.querySelectorAll('.opt')];const current=buttons.indexOf(document.activeElement);const direction=['ArrowUp','ArrowLeft'].includes(key)?-1:1;buttons[current<0?0:(current+direction+4)%4].focus();return;}if(key==='Enter'||key===' '){event.preventDefault();if(answered)next();else pick(Number(document.activeElement.dataset.choice??0));}});
function validate(data){if(!Array.isArray(data)||!data.length)throw Error('empty');const ids=new Set(),groups=new Map();for(const q of data){if(!q||typeof q.id!=='string'||!q.id||ids.has(q.id)||!TYPES.includes(q.type)||typeof q.lesson!=='string'||!['易','中','難'].includes(q.difficulty)||typeof q.stem!=='string'||!Array.isArray(q.options)||q.options.length!==4||q.options.some(o=>typeof o!=='string')||!Number.isInteger(q.answer)||q.answer<0||q.answer>3||typeof q.explain!=='string')throw Error('invalid');ids.add(q.id);if(q.type==='閱讀理解'){if(typeof q.groupId!=='string'||!q.groupId||typeof q.passage!=='string'||!q.passage)throw Error('group');if(!groups.has(q.groupId))groups.set(q.groupId,[]);groups.get(q.groupId).push(q);}else if(q.groupId)throw Error('group');}for(const group of groups.values())if(group.length<2||group.length>3||group.some(q=>q.passage!==group[0].passage))throw Error('group');return data;}
home();fetch('./questions.json').then(response=>{if(!response.ok)throw Error('load');return response.json();}).then(data=>{bank=validate(data);loaded=true;prepared=drawRound();home();}).catch(error);
</script>
</body>
</html>
